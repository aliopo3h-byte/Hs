<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>صعود</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=El+Messiri:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* لوحة واحدة بلونين تتبدّل مع كل مرحلة: حبر مضيء على عتمة */
  :root {
    --void: #07060d;
    --ink: #ece6fb;
    --ink-dim: #a39db6;
    --line: rgba(163, 157, 182, 0.35);
    --veil: rgba(0, 0, 0, 0.78);
    --display: "Aref Ruqaa", "El Messiri", "Geeza Pro", Tahoma, serif;
    --body: "El Messiri", "Noto Sans Arabic", "Geeza Pro", "Segoe UI", Tahoma, sans-serif;
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  *, *::before, *::after { box-sizing: inherit; }
  [hidden] { display: none !important; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%;
    margin: 0;
    background: var(--void);
    color: var(--ink);
    font-family: var(--body);
    letter-spacing: 0;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; touch-action: none; cursor: grab; }
  #stage:focus-visible { outline: 2px solid var(--ink); outline-offset: -4px; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }

  .hud {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    left: 0; right: 0;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 18px;
    pointer-events: none;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 6px var(--void), 0 0 2px var(--void);
    transition: opacity 0.5s ease;
  }
  body.title .hud, body.title .mute, body.title .prog { opacity: 0; pointer-events: none; }
  .hud .stars { justify-self: end; }
  .lives { display: flex; gap: 6px; direction: ltr; }
  .lives svg { width: 14px; height: 20px; fill: var(--ink); stroke: var(--ink); stroke-width: 1; }
  .lives svg.out { fill: none; stroke: var(--ink-dim); }

  /* شريط المراحل: ست قطع بطول كل مرحلة، تمتلئ من اليمين */
  .prog {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 44px);
    left: 18px; right: 18px;
    height: 5px;
    display: flex; gap: 3px;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  .prog i { position: relative; flex: var(--f, 1) 1 0; background: var(--line); overflow: hidden; }
  .prog b { position: absolute; inset: 0; background: var(--ink); transform: scaleX(var(--v, 0)); transform-origin: right center; }

  .banner {
    position: fixed;
    left: 0; right: 0;
    top: calc(env(safe-area-inset-top, 0px) + 13vh);
    padding: 0 16px;
    text-align: center;
    font-family: var(--display);
    font-size: 40px;
    font-weight: 700;
    line-height: 1.35;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.9s ease;
    text-shadow: 0 0 10px var(--void), 0 0 3px var(--void);
  }
  .banner.on { opacity: 1; }
  .banner small { display: block; font-family: var(--body); font-size: 17px; font-weight: 500; color: var(--ink-dim); }

  .hint {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 9vh);
    padding: 0 22px;
    text-align: center;
    pointer-events: none;
    text-shadow: 0 0 8px var(--void), 0 0 2px var(--void);
    transition: opacity 0.6s ease;
  }
  .hint.gone { opacity: 0; }
  .hint b { display: block; font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1.4; }
  .hint small { display: block; font-size: 18px; color: var(--ink-dim); margin-top: 6px; line-height: 1.5; text-wrap: balance; }
  .hint .go { color: var(--ink); font-weight: 700; }
  .hint.wait .go { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }

  /* واجهة البداية: العنوان في الأعلى ولوحة البدء في الأسفل، والبرج ظاهر بينهما */
  .start, .end {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: calc(env(safe-area-inset-top, 0px) + 4vh) 20px calc(env(safe-area-inset-bottom, 0px) + 20px);
    transition: opacity 0.7s ease, visibility 0.7s;
    overflow-y: auto;
  }
  .start {
    justify-content: space-between;
    background: linear-gradient(to bottom,
      rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.55) 20%, rgba(0,0,0,0) 36%,
      rgba(0,0,0,0) 52%, rgba(0,0,0,0.86) 64%, rgba(0,0,0,0.96) 100%);
  }
  .start.hide, .end.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  .start-head { text-align: center; animation: drop 0.9s ease both; }
  .start-panel { animation: rise 0.9s 0.15s ease both; }
  @keyframes drop { from { opacity: 0; transform: translateY(-14px); } }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
  .start h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(84px, 30vw, 136px);
    line-height: 1.15;
    text-shadow: 0 0 26px var(--line), 0 3px 0 var(--void);
  }
  .rule {
    width: 150px; height: 9px; margin: 0 auto 10px;
    background: linear-gradient(var(--ink-dim), var(--ink-dim)) center / 100% 1px no-repeat;
    position: relative;
  }
  .rule::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 9px; height: 9px; background: var(--ink);
    transform: translate(-50%, -50%) rotate(45deg);
  }
  .start .kicker { margin: 0; font-size: 18px; font-weight: 500; color: var(--ink); text-shadow: 0 0 8px var(--void), 0 0 2px var(--void); }

  .start-panel, .end-card {
    width: min(100%, 372px);
    padding: 16px 16px 10px;
    background: var(--veil);
    border: 1px solid var(--ink-dim);
    box-shadow: 0 0 0 4px var(--void), 0 0 0 5px var(--ink-dim);
  }
  .play {
    display: block;
    width: 100%; min-height: 58px;
    padding: 8px 20px;
    font-family: var(--display);
    font-weight: 700;
    font-size: 30px; line-height: 1.3;
    color: var(--void);
    background: var(--ink);
    border: 0;
    cursor: pointer;
    transition: transform 0.12s ease;
  }
  .play:active { transform: scale(0.97); }
  .play:focus-visible { outline: 3px solid var(--ink); outline-offset: 5px; }

  /* اختيار المرحلة */
  .stage-name { margin: 12px 0 6px; font-size: 16px; font-weight: 700; text-align: center; }
  .stage-name span { color: var(--ink-dim); font-weight: 500; }
  .stages { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .chip {
    min-height: 44px; padding: 0;
    font-family: var(--body); font-size: 19px; font-weight: 700; line-height: 1;
    color: var(--ink); background: transparent;
    border: 1px solid var(--ink-dim);
    cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--void); border-color: var(--ink); }
  .chip:disabled { color: var(--ink-dim); border-style: dashed; opacity: 0.55; cursor: default; }
  .chip:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .record { margin: 10px 0 0; font-size: 15px; font-weight: 700; text-align: center; color: var(--ink); }
  .record:empty { display: none; }
  .how { list-style: none; margin: 10px 0 0; padding: 0; font-size: 15px; line-height: 1.45; color: var(--ink); }
  .how li {
    display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: center;
    padding: 6px 2px; text-align: start;
    border-top: 1px solid var(--line);
  }
  .how svg { width: 20px; height: 20px; fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .credit {
    margin: 2px 0 0; padding-top: 8px;
    border-top: 1px solid var(--ink-dim);
    font-size: 14px; text-align: center; color: var(--ink-dim);
  }
  .credit bdi { font-weight: 700; color: var(--ink); }

  /* بطاقة النهاية */
  .end { justify-content: flex-end; background: linear-gradient(to bottom, rgba(0,0,0,0) 40%, rgba(0,0,0,0.8) 100%); }
  .end-card { padding: 18px 16px 16px; text-align: center; }
  .end-card h2 { margin: 0; font-family: var(--display); font-size: 46px; font-weight: 700; line-height: 1.3; }
  .end-sub { margin: 0 0 12px; font-size: 17px; color: var(--ink-dim); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin: 0 0 12px; border-block: 1px solid var(--line); }
  .stats div { padding: 10px 4px; }
  .stats div + div { border-inline-start: 1px solid var(--line); }
  .stats dt { font-size: 13px; color: var(--ink-dim); }
  .stats dd { margin: 2px 0 0; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .end-note { margin: 0 0 12px; font-size: 15px; color: var(--ink); min-height: 1.4em; }

  .mute {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    left: 14px;
    width: 44px; height: 44px;
    display: grid; place-items: center;
    background: var(--void);
    color: var(--ink);
    border: 1px solid var(--ink-dim);
    border-radius: 0;
    padding: 0;
    cursor: pointer;
    transition: opacity 0.5s ease;
  }
  .mute:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .mute svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; }
  .mute .off { display: none; }
  .mute[aria-pressed="true"] .on { display: none; }
  .mute[aria-pressed="true"] .off { display: inline; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  @media (max-height: 700px) {
    .start h1 { font-size: clamp(64px, 23vw, 96px); }
    .start, .end { padding-top: calc(env(safe-area-inset-top, 0px) + 2vh); gap: 8px; }
    .how li { padding: 4px 2px; }
    .play { min-height: 52px; font-size: 27px; }
  }
  @media (max-height: 600px) { .how { display: none; } }
  @media (max-width: 260px) {
    .hud { font-size: 13px; padding: 0 8px; top: calc(env(safe-area-inset-top, 0px) + 6px); }
    .prog { top: calc(env(safe-area-inset-top, 0px) + 26px); left: 8px; right: 8px; height: 3px; }
    .lives svg { width: 9px; height: 13px; }
    .hint b { font-size: 20px; } .hint small { font-size: 13px; }
    .banner { font-size: 20px; } .banner small { font-size: 12px; }
    .start h1 { font-size: 48px; } .play { font-size: 19px; min-height: 44px; }
    .start, .end { padding-left: 8px; padding-right: 8px; } .start-panel, .end-card { padding: 8px; }
    .how, .start .kicker, .credit, .stage-name, .record { display: none; }
    .chip { min-height: 30px; font-size: 13px; } .stages { gap: 2px; margin-top: 6px; }
    .end-card h2 { font-size: 24px; } .stats dd { font-size: 15px; } .stats dt { font-size: 10px; }
    .mute { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hint, .banner, .start, .end, .hud, .prog { transition: none; }
    .hint.wait .go, .start-head, .start-panel { animation: none; }
  }
</style>
</head>
<body class="title">
<div id="stage" tabindex="0" role="application" aria-label="لعبة صعود: اضغط مطوّلاً أو اسحب لتصعد الدرج الحلزوني، انقر نقرة سريعة لتقفز، وتوقّف لتنحني. ست مراحل حتى المنارة">
  <canvas id="c"></canvas>
</div>
<div class="hud">
  <span id="floor">الطابق ٠</span>
  <span class="lives" id="lives" role="img" aria-label="الشعلات الباقية ٣"></span>
  <span class="stars" id="stars">✦ ٠</span>
</div>
<div class="prog" id="prog" aria-hidden="true"></div>
<div class="banner" id="banner"></div>
<div class="hint gone" id="hint"></div>
<button class="mute" id="mute" type="button" aria-pressed="false" aria-label="كتم الصوت">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M3 9h4l5-4v14l-5-4H3z"/>
    <path class="on" d="M16 9c1.5 1.5 1.5 4.5 0 6M19 6c3 3 3 9 0 12"/>
    <path class="off" d="M16 9l6 6M22 9l-6 6"/>
  </svg>
</button>
<div class="start" id="start">
  <header class="start-head">
    <h1>صعود</h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="kicker">ست مراحل وشعلة واحدة حتى المنارة</p>
  </header>
  <div class="start-panel">
    <button class="play" id="play" type="button">ابدأ الصعود</button>
    <p class="stage-name" id="stagename"></p>
    <div class="stages" id="stages" role="group" aria-label="اختر المرحلة"></div>
    <p class="record" id="record"></p>
    <ul class="how">
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8.5"/></svg><span>اضغط مطوّلاً أو اسحب لتصعد</span></li>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M7 10l5-5 5 5"/><circle cx="12" cy="19" r="2"/></svg><span>انقر نقرة سريعة لتقفز إلى الأمام</span></li>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18h16M7 18v-4a5 5 0 0 1 10 0v4"/></svg><span>ارفع إصبعك لتتوقف وتنحني</span></li>
    </ul>
    <p class="credit">تطوير <bdi>ابوالحسن عبدالهادي 42i</bdi></p>
  </div>
</div>
<div class="end hide" id="end" aria-hidden="true">
  <div class="end-card" role="dialog" aria-labelledby="end-title">
    <h2 id="end-title">أُضيئت المنارة</h2>
    <p class="end-sub">بلغتَ قمة البرج</p>
    <dl class="stats">
      <div><dt>الزمن</dt><dd id="e-time">٠:٠٠</dd></div>
      <div><dt>النجوم</dt><dd id="e-stars">٠</dd></div>
      <div><dt>شعلات انطفأت</dt><dd id="e-lost">٠</dd></div>
    </dl>
    <p class="end-note" id="e-note"></p>
    <button class="play" id="again" type="button">اصعد من جديد</button>
  </div>
</div>
<div class="sr" id="live" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  // ---------- ثوابت العالم (كل وحدة عالم = S بكسل) ----------
  const S = 2, TAU = Math.PI * 2;
  const RW = 44;                  // نصف قطر البرج
  const RS = 62;                  // طرف الدرجة الخارجي
  const RM = 53;                  // خط سير المسافر
  const RG = 84;                  // نصف قطر الصخرة التي يقوم عليها البرج
  const N = 24, DA = TAU / N;     // درجات كل لفّة
  const SH = 4, REV = N * SH, TH = 6;
  const TREAD_PX = RM * DA * S, RISE_PX = SH * S;   // المسافة بين درجتين على الشاشة
  const TILT = 0.32, TS = TILT * S;
  const MOON_A = 0.9;             // اتجاه ضوء القمر في العالم
  const SUN_A = MOON_A + 2.6;     // اتجاه الفجر
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- المراحل الست ----------
  // haz: أوزان [براميل، غربان، سواقط]  ·  every: الفاصل بين العقبات بالثواني
  const STAGES = [
    { name: 'أسفل البرج', floors: 5, tip: 'براميل تتدحرج: انقر لتقفز فوقها، أو توقّف لتنحني', haz: [1, 0, 0], gaps: false, every: [3.4, 4.6], ghost: 0.3 },
    { name: 'جدار اللبلاب', floors: 5, tip: 'غربان تنقضّ: توقّف لتنحني تحتها ولا تقفز', haz: [0.5, 0.5, 0], gaps: false, every: [3.0, 4.2], ghost: 0.25 },
    { name: 'برج الرموز', floors: 6, tip: 'درجات مكسورة: انقر لتقفز فوق الفجوة', haz: [0.7, 0.3, 0], gaps: true, every: [3.0, 4.0], ghost: 0.75 },
    { name: 'قلب العاصفة', floors: 6, tip: 'حجارة تسقط: لا تقف على الدرجة المعلَّمة', haz: [0.45, 0, 0.55], gaps: false, every: [2.7, 3.7], ghost: 0.1 },
    { name: 'أعالي الجليد', floors: 6, tip: 'جليد يتساقط ودرجات مكسورة تحت الثلج', haz: [0.2, 0.35, 0.45], gaps: true, every: [2.6, 3.5], ghost: 0.2 },
    { name: 'طريق المنارة', floors: 5, tip: 'كل ما مرّ بك دفعة واحدة، والمنارة فوقك', haz: [0.34, 0.33, 0.33], gaps: true, every: [2.3, 3.2], ghost: 0 }
  ];
  const ORD = ['الأولى', 'الثانية', 'الثالثة', 'الرابعة', 'الخامسة', 'الأخيرة'];
  const STAGE_START = [];
  let TOP_FLOOR = 0;
  for (const s of STAGES) { STAGE_START.push(TOP_FLOOR); TOP_FLOOR += s.floors; }
  const I_END = TOP_FLOOR * N;    // آخر درجة
  const TOPY = TOP_FLOOR * REV;   // ارتفاع سطح البرج
  const MERLON = 9;               // ارتفاع شرفات السطح
  const stageOfFloor = f => { let k = 0; for (let i = 1; i < STAGES.length; i++) if (f >= STAGE_START[i]) k = i; return k; };
  // مواقد تعيد الشعلات: عند بداية كل مرحلة وفي منتصفها
  const CHECKPOINTS = new Set();
  STAGES.forEach((s, k) => { if (k) CHECKPOINTS.add(STAGE_START[k]); CHECKPOINTS.add(STAGE_START[k] + Math.ceil(s.floors / 2)); });

  // لوحة كل مرحلة: [حبر، عتمة]
  const PAL = [
    [[236, 230, 251], [7, 6, 13]],
    [[224, 243, 214], [5, 10, 7]],
    [[219, 202, 255], [10, 6, 18]],
    [[203, 216, 240], [4, 7, 13]],
    [[221, 244, 255], [3, 10, 18]],
    [[255, 231, 196], [18, 10, 9]]
  ];
  const PAL_DAWN = [[255, 243, 220], [44, 22, 17]];

  const $ = id => document.getElementById(id);
  const stage = $('stage'), canvas = $('c'), ctx = canvas.getContext('2d', { alpha: false });
  const floorEl = $('floor'), livesEl = $('lives'), starsEl = $('stars'), progEl = $('prog');
  const hintEl = $('hint'), bannerEl = $('banner'), liveEl = $('live'), muteEl = $('mute');
  const startEl = $('start'), playEl = $('play'), recordEl = $('record'), stagesEl = $('stages'), stageNameEl = $('stagename');
  const endEl = $('end'), againEl = $('again');

  const mod = (a, n) => ((a % n) + n) % n;
  const wrap = a => mod(a + Math.PI, TAU) - Math.PI;
  const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
  const sstep = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
  function hash(n) {
    n = Math.imul(n ^ 0x9e3779b9, 0x85ebca6b); n ^= n >>> 13;
    n = Math.imul(n, 0xc2b2ae35); n ^= n >>> 16;
    return (n >>> 0) / 4294967296;
  }
  function vnoise(x, y, perX, perY) {
    const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
    const x0 = mod(xi, perX), x1 = mod(xi + 1, perX), y0 = mod(yi, perY), y1 = mod(yi + 1, perY);
    const a = hash(x0 * 374761 + y0 * 668265 + 11), b = hash(x1 * 374761 + y0 * 668265 + 11);
    const c = hash(x0 * 374761 + y1 * 668265 + 11), d = hash(x1 * 374761 + y1 * 668265 + 11);
    const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
  }

  // درجة مكسورة في المراحل التي فيها فجوات: واحدة كل عشرين درجة تقريباً، بعيداً عن المواقد
  function gapAt(i) {
    if (i < 8 || i > I_END - 12) return false;
    if (!STAGES[stageOfFloor(Math.floor(i / N))].gaps) return false;
    const blk = Math.floor(i / 20);
    if (i !== blk * 20 + 5 + Math.floor(hash(blk * 7 + 3) * 10)) return false;
    const m = i % N;
    return m > 3 && m < N - 3 && hash(blk * 13 + 1) < 0.8;
  }
  function nextGap(pp) {

  // دعامة مثلثة تحمل الدرجة، تظهر من الجانب

  // هالة ناعمة حول اللهب
  function glow(sxc, syc, rad, strength) {
    const x0 = Math.max(0, Math.floor(sxc - rad)), x1 = Math.min(W - 1, Math.ceil(sxc + rad));

    }
  }

  // ---------- سطح البرج والمنارة ----------
  function drawRoof() {
    const base = camTopB - TOPY * S;
    if (base - RC * TILT - MERLON * S > H || base + RC * TILT < 0) return;

      if (mod((cam + Math.PI - colPhi[k]) / TAU * 18, 1) <= 0.56) {

      }

      for (let sy = Math.max(0, yb), e = Math.min(H - 1, base + dep); sy <= e; sy++) {

  // المنارة: عمود حجري مستدقّ فوقه سلّة حديد، ولهب كبير حين تُشعل

  // حزمتا ضوء تدوران كفنار

  // ---------- جسيمات الجو: مطر وثلج وأوراق ويراعات وشرر ----------

  }
  function drawWeather(front) {
    for (const r of rainP) {

      const len = front ? 9 : 5, v = front ? 0.85 : 0.42;
      for (let k = 0; k < len; k++) put(Math.round(r.x - k * rainSlant), Math.round(r.y - k), v);

  // ---------- البرق ----------
  let flash = 0, nextBolt = 5, bolt = null, turbo = 1;

  // ---------- الإطار ----------

    const footNow = Math.floor(p + 0.5);

        bits.push({ x: cx + 12, Y: feetY + 6, vx: -24, vy: 14, g: 80, life: 0.22, big: 0 });
      }
    }

    // ---- مصادر الضوء: المشعل، المواقد، مشاعل الجدار، المنارة ----
    const flick = reduceMotion ? 0 : Math.sin(time * 13) * 2 + Math.sin(time * 7.3) * 1.6 + env.rain * Math.sin(time * 23) * 2.2;
    const fade = mode === 'dead' ? Math.max(0.2, 1 - (time - deadAt) * 1.2) : 1;
    const R = (Math.min(108, Math.max(72, W / S * 0.72)) * (1 - env.rain * 0.12) + flick) * fade;
    const tx = 7.5, ty = meY + 30 + jumpY - duckPose * 8, td = RM + 2;
    lights.length = 0;
    lights.push(tx, ty, td, R, R * R);
    const braziers = [], sconces = [];
    for (const m of CHECKPOINTS) {
      const y = m * REV;
      if (y > topW + 30 || y < botW - 60) continue;
      const lit = m <= reached, c = Math.cos(-cam);
      braziers.push({ y, lit, c });
      if (lit && c > -0.3) { const r = 56 - flick; lights.push((RW + 7) * Math.sin(-cam), y + 16, (RW + 7) * c, r, r * r); }
    }
    for (let i = Math.ceil((botW / SH - N / 2) / N) * N + N / 2; i * SH < topW; i += N) {
      if (i < N / 2) continue;
      const a = i * DA, c = Math.cos(a - cam), y = i * SH + 46;
      if (c < 0.05 || y + 12 > TOPY) continue;
      sconces.push({ a, y });
      const r = 34 + flick * 0.5;
      lights.push((RW + 4) * Math.sin(a - cam), y + 5, (RW + 4) * c, r, r * r);
    }
    if (beaconGrow > 0) { const r = 70 + 200 * beaconGrow + flick * 2; lights.push(0, TOPY + 46, 0, r, r * r); }
    nl = lights.length;

    // البرق وضوء الفجر
    if (env.rain > 0.5 && mode !== 'summit') { nextBolt -= dt; if (nextBolt <= 0) { strike(); nextBolt = 5 + Math.random() * 6; } }
    if (flash > 0) { flash *= Math.exp(-dt * 3.4); if (flash < 0.02) flash = 0; }
    if (bolt) { bolt.t -= dt; if (bolt.t <= 0) bolt = null; }
    MK = env.moon;
    ambH = flash * 0.75 + env.dawn * 0.5;
    ambV = flash * 0.5 + env.dawn * 0.3;
    ambT -= dt;
    if (ambT <= 0) { ambT = 0.5; setAmbience(); }
    if (mode === 'play') {
      chirpT -= dt;
      if (chirpT <= 0) { chirpT = 2.5 + Math.random() * 4; if ((env.fly > 0.5 && env.over < 0.2) || env.dawn > 0.25) chirp(); }
    }

    // ---- العقبات والنجوم ----
    if (mode === 'play') {
      if (time > nextHaz && p > STAGE_START[runFrom] * N + 4) {
        spawnHazard(st);
        const ev = STAGES[st].every;
        nextHaz = time + ev[0] + Math.random() * (ev[1] - ev[0]);
      }
      if (time > nextStar) {
        spawnStar(lives < 3 && Math.random() < 0.3 ? 'ember' : 'star');
        nextStar = time + 3 + Math.random() * 4;
      }
    }
    for (let i = things.length - 1; i >= 0; i--) {
      const o = things[i];
      if (o.kind === 'barrel') {
        o.q -= o.vq * dt;
        o.rot += o.vq * dt * 3.2;
        if (o.q < p - 9) { things.splice(i, 1); continue; }
        // يرتكز على الدرج قبل المسافر وبعده، ويعلو في قوس فوق موضعه
        const relQ = o.q - p, bouncePeriod = 1.7;
        o.bounceH = Math.abs(Math.cos(relQ * Math.PI / bouncePeriod)) * ((relQ > -1 && relQ < 1) ? 26 : 16);
        o.y = o.q * SH + o.bounceH + 3;
        const a = o.q * DA, rel = Math.cos(a - cam), osx = VX(RM, a), front = rel > -0.15;
        const bIdx = Math.floor((relQ + bouncePeriod * 0.5) / bouncePeriod);
        if (bIdx !== o.lastBounce) {
          o.lastBounce = bIdx;
          if (front && Math.abs(relQ) < 9) {
            burst(osx, o.q * SH * S - RM * rel * TS + 2, 5, 65);
            thud(320, 0.09, Math.max(0.06, 0.24 * (1 - Math.abs(relQ) / 10)));
          }
        }
        if (mode === 'play' && Math.abs(relQ) < 0.48) {
          const safe = jumpY > 8.5 || !isClimbing || duckPose > 0.55;
          if (!safe && time > hurtUntil) {
            burst(osx, o.y * S - RM * rel * TS, 14, 140);
            things.splice(i, 1);
            hit('أصابك برميل');
            continue;
          } else if (!o.passed && relQ <= 0) { o.passed = true; tone('sine', 540, 760, 0.14, 0.06); }
        }
      } else if (o.kind === 'raven') {
        o.q -= o.vq * dt;
        if (o.q < p - 9) { things.splice(i, 1); continue; }
        const relQ = o.q - p;
        o.y = o.q * SH + 27 + Math.sin(time * 6 + o.ph) * 2.5;
        if (mode === 'play' && !o.passed && Math.abs(relQ) < 0.5) {
          // ينجو المنحني فقط؛ القافز يصطدم به
          const safe = (!isClimbing || duckPose > 0.55) && jumpY < 6;
          if (!safe && time > hurtUntil) {
            const a = o.q * DA;
            burst(VX(RM, a), o.y * S - RM * Math.cos(a - cam) * TS, 10, 110);
            things.splice(i, 1);
            hit('أصابك غراب');
            continue;
          } else if (relQ <= 0) { o.passed = true; tone('sine', 540, 760, 0.14, 0.06); }
        }
      } else if (o.kind === 'fall') {
        const a = o.q * DA, rel = Math.cos(a - cam), osx = VX(RM, a), front = rel > -0.1;
        if (o.q < p - 4) { things.splice(i, 1); continue; }
        if (o.wait > 0) {
          o.wait -= dt;
          if (front && Math.random() < dt * 26) bits.push({ x: osx + Math.random() * 14 - 7, Y: camTopB, vx: 0, vy: -260 - Math.random() * 120, g: 0, life: 0.6, big: 0 });
          continue;
        }
        o.vy += 170 * dt; o.y -= o.vy * dt;
        if (o.y <= o.ty + 2) {
          if (front) burst(osx, o.ty * S - RM * rel * TS + 2, o.ice ? 16 : 12, 120);
          if (front && Math.abs(o.ty - meY) < 90) {
            shake = Math.max(shake, 0.12);
            if (o.ice) { tone('sine', 2600, 1700, 0.18, 0.06); tone('sine', 3300, 2100, 0.22, 0.05, 0.04); thud(600, 0.12, 0.2); }
            else { thud(260, 0.3, 0.35); tone('sine', 90, 40, 0.25, 0.18); }
          }
          const struck = mode === 'play' && Math.abs(o.q - p) < 0.75 && jumpY < 14 && time > hurtUntil;
          things.splice(i, 1);
          if (struck) hit(o.ice ? 'أصابك الجليد' : 'أصابك حجر');
        }
      } else {
        if (o.q < p - 3) { things.splice(i, 1); continue; }
        if (o.rest === 0) { o.y -= o.vy * dt; if (o.y <= o.ty + 6) { o.y = o.ty + 6; o.rest = time; } }
        if (mode === 'play' && Math.abs(o.q - p) < 0.9 && Math.abs(o.y - (meY + jumpY + 10)) < 22) {
          const a = o.q * DA;
          burst(VX(RM, a), o.y * S - RM * TS + 6, 10, 90);
          if (o.kind === 'ember') {
            if (lives < 3) { lives++; drawLives(); }
            liveEl.textContent = 'عادت إليك شعلة';
            tone('triangle', 440, 880, 0.35, 0.09);
          } else {
            stars++; starsEl.textContent = '✦ ' + num(stars);
            const f0 = [659, 784, 880, 988, 1175][stars % 5];
            tone('sine', f0, 0, 0.35, 0.08); tone('sine', f0 * 1.5, 0, 0.45, 0.05, 0.07);
            if (stars % 3 === 0 && lives < 3) { lives++; drawLives(); liveEl.textContent = 'عادت إليك شعلة'; }
          }
          things.splice(i, 1);
        }
      }
    }
    updateWeather(dt, dCam);

    // ---- 1: السماء والأفق والصخرة ----
    const skyOff = cam * SKY_K, starV = Math.floor(camTopB * 0.05), cloudV = Math.floor(camTopB * 0.11);
    const drift = reduceMotion ? 0 : time;
    const cloudOff = skyOff - drift * 5, cloudOff2 = skyOff * 0.6 - drift * 16, seaOff = skyOff - drift * 2.2;
    const cloudV2 = Math.floor(camTopB * 0.3 + drift * 6), seaRow = Math.floor(camTopB * 0.2);
    const moonX = cx + wrap(cam - (MOON_A + Math.PI)) * SKY_K, moonY = H * 0.24;
    const sunX = cx + wrap(cam - (SUN_A + Math.PI)) * SKY_K;
    const MR = Math.max(22, Math.min(34, W * 0.1)), MR2 = MR * MR, HALO = MR + 18, HALO2 = HALO * HALO;
    const MGL = MR * 4.5, MGL2 = MGL * MGL;
    const twk = Math.floor(time * 3), rip = Math.floor(drift * 2), rip2 = Math.floor(drift * 5);
    const RGX = RG * S, RGY = RG * TS, TOPB = TOPY * S;
    const groundVisible = camTopB - H < RGY + 2;
    const hz = Math.round(H * 0.5 + (feetY + 34) * 0.2);                      // خط الأفق يهبط كلما صعدنا
    const landOn = hz < H + 128;
    const seaTop = Math.round(H * (1.12 - env.sea * (0.38 - 0.14 * sstep(STAGE_START[4], TOP_FLOOR, alt))));
    const seaOn = env.sea > 0.01 && seaTop < H + 30;
    const seaLit = 0.3 + 0.45 * env.moon;
    const over = env.over, clearK = 1 - over, moonOn = env.moon > 0.4;
    const starLim = 201 * env.star, bigStars = env.star > 0.35;
    const aurOn = env.aur > 0.01;
    const sunW = W * 0.6;
    for (let sx = 0; sx < W; sx++) {
      colIdx[sx] = mod(Math.floor(sx - skyOff), PER);
      colCld[sx] = mod(Math.floor(sx - cloudOff), PER);
      colCld2[sx] = mod(Math.floor(sx * 0.7 - cloudOff2), PER);
      colSea[sx] = mod(Math.floor(sx - seaOff), PER);
      const ds = (sx - sunX) / sunW;
      colSun[sx] = 0.5 + 0.5 * Math.exp(-ds * ds);
      if (aurOn) {
        // ستائر الشفق: شدّتها وحافتها السفلى تتموّجان مع الاتجاه والزمن
        const az = (sx - skyOff) / SKY_K;
        const band = Math.max(0, Math.sin(az * 2 + drift * 0.17 + 1.3 * Math.sin(az * 3 - drift * 0.09)));
        aurA[sx] = env.aur * 0.85 * band * Math.sqrt(band) * (0.55 + 0.45 * Math.sin(az * 37 + Math.sin(drift * 0.6 + az * 5) * 2));
        aurBot[sx] = H * (0.4 + 0.07 * Math.sin(az * 4 + drift * 0.13) + 0.03 * Math.sin(az * 9 - drift * 0.21));
      }
    }
    const glowY = seaOn ? seaTop : H;
    for (let sy = 0; sy < H; sy++) {
      rowGlow[sy] = landOn && sy < hz ? 0.34 * Math.exp(-(hz - sy) / 110) * env.moon : 0;
      const d = (glowY - sy) / H;
      rowDawn[sy] = env.dawn > 0 ? env.dawn * (d > 0 ? 0.95 * Math.exp(-d * 2.4) : 0.95) : 0;
    }
    for (let sy = 0, i = 0; sy < H; sy++) {
      const Y = camTopB - sy;
      const sr = mod(sy - starV, SKH) * PER, cr = mod(sy - cloudV, SKH) * PER, cr2 = mod(Math.floor(sy * 0.8) - cloudV2, SKH) * PER;
      const land = landOn && sy >= hz - 128, sea = seaOn && sy >= seaTop - 30;
      const rg = rowGlow[sy], rd = rowDawn[sy];
      for (let sx = 0; sx < W; sx++, i++) {
        if (sx >= tx0 && sx <= tx1) { const vi = Y + colDep[sx - tx0]; if (vi >= 0 && vi < TOPB) continue; }
        const X = sx - cx + 0.5;
        let v = -1;
        if (groundVisible && Y < RGY) {
          const e = (X / RGX) * (X / RGX);
          if (e < 1) {
            const ry = RGY * Math.sqrt(1 - e);
            if (Y >= -ry) {
              const wxg = X / S, wdg = -Y / TS, r = Math.hypot(wxg, wdg);
              const ring = Math.floor(r / 11), segs = 6 + ring * 3;
              const fa = mod((Math.atan2(wxg, wdg) + cam) / TAU * segs + ring * 0.37, segs);
              const m = mod(r, 11) < 0.8 || fa - Math.floor(fa) < 0.05 ? 0.12 : 0.36 + hash(ring * 71 + Math.floor(fa) * 13) * 0.16;
              const l = lightAt(wxg, 0, wdg) + 0.2 * MK + ambH;
              v = m * (l > 1 ? 1 : l);
            } else {
              const dd = (-ry - Y) / S, wd = RG * Math.sqrt(1 - e);
              const m = 0.22 + hash(Math.floor((X + dd * 3) / 7) * 13 + Math.floor(dd / 4) * 7) * 0.2 + hash(Math.floor(X / 2) * 31 + Math.floor(dd) * 17) * 0.1;
              // جرف الصخرة: يلتقط ضوء القمر من جهته ويغيب في العتمة نزولاً
              const l = lightAt(X / S, -dd, wd) + (0.1 + 0.34 * Math.max(0, Math.cos(Math.asin(X / RGX) + cam - MOON_A))) * MK + ambV;
              v = m * Math.max(0, 1 - dd / 120) * (l > 1 ? 1 : l);
            }
          }
        }
        if (v < 0 && land) {
          const idx = colIdx[sx];
          if (sy >= hz) {
            // بحيرة: انعكاس الجبال، تموّجات، ودرب ضوء القمر
            const d = sy - hz;
            v = 0.03 + 0.1 * Math.exp(-d / 30) * env.moon;
            if (d < mtFar[idx] * 0.55) v *= 0.35;
            else if ((d + (idx >> 2) + rip) % 9 === 0 && hash(idx * 7 + d) > 0.45) v = 0.2;
            const gdx = sx - moonX, gw = 2.5 + d * 0.32;
            if (moonOn && gdx > -gw && gdx < gw && hash((d >> 1) * 131 + ((sx + rip2 * (1 + (d >> 3))) >> 1)) > 0.42 + 0.3 * Math.abs(gdx) / gw) v = 0.95;
            if (d < 4) v = Math.max(v, 0.22 - d * 0.045);
          } else {
            const upv = hz - sy, mf = mtFar[idx];
            if (upv <= mtNear[idx]) v = 0;
            else if (upv <= mf) v = mf > 46 && upv > mf - (mf - 38) * 0.45 && (mtLit[idx] || hash(idx * 3 + upv) > 0.55) ? 0.55 * env.moon + 0.06 : 0.035;
          }
        }
        if (v < 0 && sea) {
          // بحر غيوم تحتنا: قمم مضيئة ووديان أعتم
          const si = colSea[sx], top = seaTop - seaH[si];
          if (sy >= top) {
            const d = sy - top;
            v = (0.3 + 0.42 * cloudTex[((d * 2 + seaRow) & 511) * PER + si] * (1 / 84) + (d < 3 ? 0.3 : 0)) * seaLit + env.dawn * 0.45 * colSun[sx] + flash * 0.3;
            if (v > 1) v = 1;
          }
        }
        if (v < 0) {
          let c = 0;
          if (clearK > 0) {
            const dx = sx - moonX, dy = sy - moonY, dm = dx * dx + dy * dy;
            if (dm < MR2) {
              // قمر أحدب: بحار داكنة، حافة أدكن، وحدّ ظل
              const nx = dx / MR, ny = dy / MR;
              const maria = vnoise(nx * 2.3 + 7.3, ny * 2.3 + 3.1, 64, 64) * 0.6 + vnoise(nx * 5.1 + 1.7, ny * 5.1 + 9.2, 64, 64) * 0.4;
              const term = nx + Math.sqrt(Math.max(0, 1 - ny * ny)) * 0.72;
              c = term < 0 ? 0.09 : (maria > 0.57 ? 0.58 : maria > 0.48 ? 0.82 : 1) * (0.8 + 0.2 * Math.sqrt(1 - dm / MR2)) * Math.min(1, term * 5 + 0.25);
            } else {
              c = cloudTex[cr + colCld[sx]] * (1 / 255);
              if (c > 0 && dm < MGL2) c *= 1 + (1 - Math.sqrt(dm) / MGL) * 1.5;
              c += rg + rd * colSun[sx];
              if (aurOn && sy < aurBot[sx]) c += aurA[sx] * aurF[(aurBot[sx] - sy) | 0];
              const stv = starTex[sr + colIdx[sx]];
              if (stv && c < 0.12 && (stv === 255 ? bigStars : stv <= starLim)) c = stv === 255 || reduceMotion || (stv + twk) % 7 ? 1 : 0;
              if (dm < HALO2) { const hv = 0.34 * (1 - (Math.sqrt(dm) - MR) / 18); if (hv > c) c = hv; }
            }
          }
          if (over > 0) {
            // غيوم العاصفة تغطي السماء ويضيئها البرق من داخلها
            const oc = 0.02 + cloudTex[cr2 + colCld2[sx]] * (0.3 / 84) + flash * (0.25 + cloudTex[cr + colCld[sx]] * (1 / 120));
            c = c * clearK + oc * over;
          }
          v = c > 1 ? 1 : c;
        }
        buf[i] = v;
      }
    }
    if (bolt) {
      const P = bolt.pts, B = bolt.br;
      for (let k = 2; k < P.length; k += 2) { line(bolt.x + P[k - 2], P[k - 1], bolt.x + P[k], P[k + 1], 1); line(bolt.x + P[k - 2] + 1, P[k - 1], bolt.x + P[k] + 1, P[k + 1], 1); }
      for (let k = 2; k < B.length; k += 2) line(bolt.x + B[k - 2], B[k - 1], bolt.x + B[k], B[k + 1], 1);
    }
    drawWeather(false);

    // ---- 2: ما يقع خلف البرج ----
    if (!reduceMotion && mode === 'play' && time > nextBat && env.rain < 0.3 && env.snow < 0.3) {
      const dir = Math.random() < 0.5 ? 1 : -1;
      bats.push({ x: dir > 0 ? -12 : W + 12, Y: camTopB - H * (0.1 + Math.random() * 0.5), vx: dir * (110 + Math.random() * 60), ph: Math.random() * 6 });
      nextBat = time + 4 + Math.random() * 6;
    }
    for (let i = bats.length - 1; i >= 0; i--) {
      const b = bats[i];
      b.x += b.vx * dt; b.Y += Math.sin(time * 5 + b.ph) * 28 * dt;
      if (b.x < -30 || b.x > W + 30) { bats.splice(i, 1); continue; }
      sprite(BAT[Math.floor(time * 9 + b.ph) % 2], b.x, camTopB - b.Y, false, 0.9);
    }
    const ghosts = [];
    for (let n = Math.max(1, Math.floor(botW / REV) - 1); n * REV < topW + 20 && n < TOP_FLOOR - 1; n++) {
      if (hash(n * 104729 + 5) >= STAGES[stageOfFloor(n)].ghost) continue;
      const a = hash(n * 311 + 9) * TAU + (reduceMotion ? 0 : time * 0.12 * (n & 1 ? 1 : -1));
      const y = n * REV + 30 + hash(n * 17) * 40 + (reduceMotion ? 0 : Math.sin(time * 1.6 + n) * 3);
      const rel = a - cam, gx = (RS + 24) * Math.sin(rel), gd = (RS + 24) * Math.cos(rel);
      const d = Math.hypot(gx - tx, y + 9 - ty, gd - td);
      const al = Math.max(0, Math.min(1, (d - 30) / 34)) * 0.85;
      if (al > 0.04) ghosts.push({ sx: cx + gx * S + shx, sy: camTopB - (y * S - gd * TS), al, back: gd < 0, flip: Math.sin(rel) > 0 });
    }
    for (const g of ghosts) if (g.back) sprite(GHOST, g.sx, g.sy, g.flip, g.al);

    stepList.length = 0;
    const iMin = Math.max(1, Math.floor((botW - RS * TILT * 2) / SH) - 3), iMax = Math.min(I_END, Math.ceil((topW + RS * TILT) / SH) + 2);
    for (let i = iMin; i <= iMax; i++) stepList.push(i);
    stepList.sort((a, b) => Math.cos(a * DA - cam) - Math.cos(b * DA - cam));
    let si = 0;
    for (; si < stepList.length && Math.cos(stepList[si] * DA - cam) < 0; si++) { drawCorbel(stepList[si]); drawStep(stepList[si]); }
    for (const o of things) {
      if (o.kind !== 'barrel' && o.kind !== 'raven') continue;
      const a = o.q * DA;
      if (Math.cos(a - cam) >= 0) continue;
      if (o.kind === 'barrel') drawBarrel3D(VX(RM, a), VY(RM, a, o.y), o.rot, o.bounceH || 0, 0.85);
      else spriteInk(RAVEN[Math.floor(time * 8 + o.ph) % 2], VX(RM, a), VY(RM, a, o.y), false);
    }
    if (topW > TOPY - 40) { drawRoof(); drawBeacon(time); drawBeams(time); }

    // ---- 3: سطح البرج، بنقش بارز يتبع اتجاه الضوء ----
    const ubase = mod(cam, TAU) / TAU * CU;
    const BK = 2.3 / GS, TOPVI = (TOPY + MERLON) * S;
    const pulse = env.rune > 0.05 && !reduceMotion ? 0.82 + 0.18 * Math.sin(time * 1.9) : 1;
    const boltSide = bolt ? bolt.side : 1;
    for (let sx = tx0; sx <= tx1; sx++) {
      const k = sx - tx0;
      const u = mod(Math.floor(ubase + colU[k]), CU);
      const cosp = colCos[k], limbS = 0.25 + 0.75 * cosp, sinp = Math.sin(colPhi[k]);
      const A = cam + colPhi[k];
      const mc = Math.max(0, Math.cos(A - MOON_A)), sc = Math.max(0, Math.cos(A - SUN_A));
      const mlMoon = (mc * 0.34 + mc * (1 - cosp) * (1 - cosp) * 0.6) * MK;
      const mlSun = env.dawn * (0.12 + sc * 0.75);
      const mlFlash = flash * (0.3 + 0.6 * clamp01(0.5 + boltSide * sinp * 0.9));
      const ml = mlMoon + mlSun + mlFlash;
      // اتجاه الضوء العام على سطح الجدار: يمين/يسار بحسب الجهة، ومن الأعلى
      const mbx = ml > 0.001 ? (mlMoon * Math.sin(MOON_A - A) + mlSun * Math.sin(SUN_A - A) + mlFlash * boltSide * 0.7) / ml * 0.8 : 0;
      const xw = colXw[k], dw = colDw[k], glowS = (0.45 + 0.55 * cosp) * pulse;
      let nc = 0;
      for (let q = 0; q < nl; q += 5) {
        const dx = lights[q] - xw, dd = dw - lights[q + 2], h2 = dx * dx + dd * dd;
        if (h2 < lights[q + 4]) { cl[nc++] = h2; cl[nc++] = lights[q + 1]; cl[nc++] = lights[q + 3]; cl[nc++] = lights[q + 4]; cl[nc++] = dx; }
      }
      let vi = camTopB + colDep[k], sy = 0;
      if (vi >= TOPVI) { sy = vi - TOPVI + 1; vi = TOPVI - 1; }
      if (sy >= H) continue;
      let cy = Math.floor(vi / CH), chunk = getChunk(cy), cm = chunk.m, cgx = chunk.gx, cgy = chunk.gy, rb = (vi - cy * CH) * CU + u;
      for (let bi = sy * W + sx; sy < H; sy++, bi += W, vi--, rb -= CU) {
        if (vi < 0) break;
        if (rb < 0) { cy--; chunk = getChunk(cy); cm = chunk.m; cgx = chunk.gx; cgy = chunk.gy; rb += CH * CU; }
        const m = cm[rb];
        if (m > 0) {
          if (m > 5) continue;                       // فراغ بين الشرفات
          const wy = vi / S, gx = cgx[rb], gy = cgy[rb];
          let l = 0, bx = 0, by = 0;
          for (let c = 0; c < nc; c += 5) {
            const dy = cl[c + 1] - wy, d2 = cl[c] + dy * dy;
            if (d2 < cl[c + 3]) {
              const d = Math.sqrt(d2), ll = 1 - d / cl[c + 2];
              if (ll > l) { l = ll; const inv = 1 / (d + 4); bx = cl[c + 4] * inv; by = dy * inv; }
            }
          }
          if (l > 0) {
            l = l * l * (3 - 2 * l) * 1.9; if (l > 1) l = 1;
            const bump = 1 - (gx * bx + gy * by) * BK;
            l *= limbS * (bump < 0.3 ? 0.3 : bump > 1.9 ? 1.9 : bump);
          }
          if (ml > 0) { const ab = 1 - (gx * mbx + gy * 0.45) * BK; l += ml * (ab < 0.3 ? 0.3 : ab > 1.9 ? 1.9 : ab); }
          const v = m * l;
          buf[bi] = v > 1 ? 1 : v;
        } else buf[bi] = m < 0 ? -m * glowS : 0;
      }
    }

    // ---- 4: ما يقع أمام البرج ----
    for (const sc of sconces) {
      const bx = VX(RW + 3, sc.a), by = VY(RW + 3, sc.a, sc.y);
      sprite(SCONCE, bx, by, false, 1);
      if (env.rain > 0.5 && hash(Math.floor(time * 9) * 31 + sc.y) < 0.22) continue;     // الريح تكاد تطفئه
      glow(bx, by - 16, 20, 0.6);
      sprite(FLAME[reduceMotion ? 0 : Math.floor(time * 8 + sc.y) % 2], bx, by - 8, false, 1);
    }
    for (; si < stepList.length; si++) { drawCorbel(stepList[si]); drawStep(stepList[si]); }

    for (const b of braziers) {
      if (b.c < 0.15) continue;
      const bx = VX(RW + 7, 0), by = VY(RW + 7, 0, b.y);
      sprite(BRAZIER, bx, by, false, b.lit ? 1 : 0.5);
      if (b.lit) {
        glow(bx, by - 26, 26, 0.65);
        sprite(FLAME[reduceMotion ? 0 : Math.floor(time * 8 + b.y) % 2], bx, by - 16, false, 1);
        if (!reduceMotion && Math.random() < dt * 6) bits.push({ x: bx + Math.random() * 8 - 4, Y: camTopB - by + 34, vx: Math.random() * 16 - 8, vy: 32, g: 0, life: 0.8, big: 0 });
      }
    }

    // غبار يسبح في ضوء المشعل
    if (!reduceMotion && env.rain < 0.5) {
      while (motes.length < 26) motes.push({ x: (Math.random() * 2 - 1) * 150, y: (Math.random() * 2 - 1) * 150, ph: Math.random() * 6 });
      for (const d of motes) {
        d.y -= 6 * dt; d.x += (Math.sin(time * 0.7 + d.ph) * 8 - spd * 6) * dt;
        const dd = d.x * d.x + d.y * d.y;
        if (dd > 26000) { d.x = (Math.random() * 2 - 1) * 130; d.y = (Math.random() * 2 - 1) * 130; continue; }
        if (dd < R * R * 2.6) put(Math.round(cx + d.x), Math.round(feetSy - 60 + d.y), 0.75);
      }
    }

    // المسافر: يُرسم أولاً في صورته الخاصة، ثم ظلّه على الجدار، ثم هو
    const torchLit = mode !== 'dead';
    const blink = time < hurtUntil && Math.floor(time * 12) % 2;
    const ksx = cx + shx;
    drawKnight(p, spd, torchLit, time, capeBlow, duckPose, jumpY, raise);
    grabKnight();
    if (torchLit) {
      const lx = ksx + 17, ly = feetSy - 66 + duckPose * 16 - raise * 9, fk = flick * 0.012;
      castShadow(ksx, feetSy, lx, ly, 1.62 + fk, 1.15, 0.74);
      castShadow(ksx, feetSy, lx, ly, 1.42 + fk, 1.1, 0.62);
    }

    // النجوم والشعلات على الدرج، وما يسقط من فوق
    const tw = Math.floor(time * 4) % 2;
    for (const o of things) {
      if (o.kind === 'barrel' || o.kind === 'raven') continue;
      const a = o.q * DA;
      if (Math.cos(a - cam) < -0.1) continue;
      const osx = VX(RM, a);
      if (o.kind === 'fall') {
        // ظل يكبر على الدرجة كلما اقترب، وعلامة تومض فوقها
        const near = clamp01(1 - (o.y - o.ty) / 150);
        groundShadow(osx, VY(RM, a, o.ty) - 1, 5 + near * 8, 2 + near * 2.5, 0.75 - near * 0.5);
        if (Math.floor(time * 7) % 2) sprite(MARK, osx, VY(RM, a, o.ty + 6), false, 1);
        if (o.wait <= 0) sprite(o.ice ? ICICLE : ROCK[o.v], osx, VY(RM, a, o.y), false, 1);
      } else {
        const bob = o.rest && !reduceMotion ? Math.sin(time * 3) * 1.5 : 0;
        sprite(o.kind === 'ember' ? FLAME[tw] : STAR[tw], osx, VY(RM, a, o.y + bob), false, 1);
      }
    }

    if (!blink) {
      if (torchLit) glow(ksx + 17, feetSy - 66 + duckPose * 16 - raise * 9, 30 + flick, 0.7);
      blitKnight(ksx, feetSy);
      if (torchLit && !reduceMotion && Math.random() < dt * 10) {
        bits.push({ x: ksx + 17 + Math.random() * 6 - 3, Y: feetY + Math.round(jumpY * S) + 72 - duckPose * 16, vx: Math.random() * 16 - 8 - spd * 8, vy: 28 + Math.random() * 16, g: 0, life: 0.6 + Math.random() * 0.7, big: 0 });
      }
    }
    // نَفَس يتكاثف في البرد
    if (env.snow > 0.5 && mode === 'play' && !reduceMotion) {
      breathT -= dt;
      if (breathT <= 0) {
        breathT = 2.2;
        for (let k = 0; k < 6; k++) bits.push({ x: ksx + 10 + k * 1.4, Y: feetY + Math.round(jumpY * S) + 56 - duckPose * 14 + Math.random() * 3, vx: 12 + Math.random() * 12, vy: 5 + Math.random() * 9, g: -8, life: 0.45 + Math.random() * 0.5, big: 0, v: 0.6 });
      }
    }
    // شرارة تطير من المشعل إلى المنارة
    if (mode === 'summit' && endT > 0.5 && endT < 1.5) {
      const f = endT - 0.5, x0 = ksx + 17, y0 = feetSy - 76, y1 = camTopB - TOPY * S - BEACON_H - 16;
      const px = Math.round(x0 + (ksx - x0) * f), py = Math.round(y0 + (y1 - y0) * f - Math.sin(Math.PI * f) * 46);
      glow(px, py, 9, 0.85);
      for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) put(px + ox, py + oy, 1);
      if (!reduceMotion) bits.push({ x: px, Y: camTopB - py, vx: Math.random() * 20 - 10, vy: Math.random() * 20 - 4, g: 60, life: 0.4, big: 0 });
    }

    // البراميل والغربان أمام المسافر، تمرّ من فوقه وهو منحنٍ
    for (const o of things) {
      if (o.kind !== 'barrel' && o.kind !== 'raven') continue;
      const a = o.q * DA;
      if (Math.cos(a - cam) < 0) continue;
      const osx = VX(RM, a);
      if (o.q > p + 0.5 && o.q < p + 6 && Math.floor(time * 8) % 2) sprite(MARK, VX(RM, (p + 1) * DA), VY(RM, (p + 1) * DA, (p + 1) * SH + 30), false, 1);
      if (o.kind === 'barrel') drawBarrel3D(osx, VY(RM, a, o.y), o.rot, o.bounceH || 0, 1);
      else spriteInk(RAVEN[Math.floor(time * 8 + o.ph) % 2], osx, VY(RM, a, o.y), false);
    }

    for (const g of ghosts) if (!g.back) sprite(GHOST, g.sx, g.sy, g.flip, g.al);

    // الشرر والحطام
    for (let i = bits.length - 1; i >= 0; i--) {
      const b = bits[i];
      b.life -= dt; b.vy -= b.g * dt; b.x += b.vx * dt; b.Y += b.vy * dt;
      if (b.life <= 0) { bits.splice(i, 1); continue; }
      const X = Math.round(b.x), Yy = Math.round(camTopB - b.Y), bv = b.v || 1;
      put(X, Yy, bv);
      if (b.big) { put(X + 1, Yy, 1); put(X, Yy + 1, 1); put(X + 1, Yy + 1, 1); }
    }
    drawWeather(true);

    // ضباب يتصاعد من الأسفل، وعتمة العاصفة تملأ الجو
    if (env.mist > 0.01) {
      const y0 = Math.floor(H * 0.78), mOff = Math.floor(skyOff * 0.4 + drift * 11);
      for (let sy = y0; sy < H; sy++) {
        const k = (sy - y0) / (H - y0), row = mod(sy + Math.floor(camTopB * 0.3), SKH) * PER, a = env.mist * k * k;
        for (let sx = 0, i = sy * W; sx < W; sx++, i++) {
          const hzv = a * (0.07 + cloudTex[row + mod(sx + mOff, PER)] * (0.34 / 84));
          if (hzv > buf[i]) buf[i] = hzv;
        }
      }
    }
    if (over > 0.05) {
      const mOff = Math.floor(skyOff * 0.5 + drift * 22);
      for (let sy = 0; sy < H; sy++) {
        const row = mod(sy + Math.floor(camTopB * 0.35), SKH) * PER, e = 2 * sy / H - 1, a = over * (0.35 + 0.65 * e * e);
        for (let sx = 0, i = sy * W; sx < W; sx++, i++) {
          const hzv = a * cloudTex[row + mod(sx + mOff, PER)] * (0.15 / 84) + flash * 0.05;
          if (hzv > buf[i]) buf[i] = hzv;
        }
      }
    }

    // ---- 5: التحويل إلى لونين بالتنقيط ----
    // حبيبات الجدار تثبت عليه وهو يتحرك، وحبيبات السماء تتحرك مع النجوم
    const fm = fadeT * fadeT * (3 - 2 * fadeT);
    const xa = tx0, xb = tx1 + 1;
    for (let sy = 0, i = 0; sy < H; sy++) {
      const tw2 = ((camTopB - sy) & TMASK) << 6, tsk = ((sy - starV) & TMASK) << 6;
      let sx = 0;
      for (; sx < xa; sx++, i++) { const t = buf[i] * vig[i] * fm; data32[i] = t * t * (1.7 - 0.7 * t) > THR[tsk | (sx & TMASK)] ? INK32 : VOID32; }
      for (; sx < xb; sx++, i++) { const t = buf[i] * vig[i] * fm; data32[i] = t * t * (1.7 - 0.7 * t) > THR[tw2 | (sx & TMASK)] ? INK32 : VOID32; }
      for (; sx < W; sx++, i++) { const t = buf[i] * vig[i] * fm; data32[i] = t * t * (1.7 - 0.7 * t) > THR[tsk | (sx & TMASK)] ? INK32 : VOID32; }
    }
    ctx.putImageData(img, 0, 0);
    requestAnimationFrame(frame);
  }

  buildChips(); updateRecord(); drawLives();
  starsEl.textContent = '✦ ' + num(0);
  selectStage(Math.min(unlocked, STAGES.length - 1));
  fadeT = 1;
  
  requestAnimationFrame(frame);
})();
</script>
