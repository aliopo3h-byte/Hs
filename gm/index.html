<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>صعود</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=El+Messiri:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #000000;
    --ink: #ece6fb;
    --ink-dim: #a39db6;
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --void: #000000; --ink: #ece6fb; --ink-dim: #a39db6; }
  }
  :root[data-theme="dark"] { --void: #000000; --ink: #ece6fb; --ink-dim: #a39db6; }

  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%;
    margin: 0;
    background: var(--void);
    color: var(--ink);
    font-family: "El Messiri", "Noto Sans Arabic", "Geeza Pro", "Segoe UI", Tahoma, sans-serif;
    letter-spacing: 0;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; touch-action: none; cursor: grab; }
  #stage:focus-visible { outline: 2px solid var(--ink); outline-offset: -4px; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }

  .hud {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    left: 0; right: 0;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 18px;
    pointer-events: none;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.2;
    text-shadow: 0 0 6px var(--void), 0 0 2px var(--void);
    transition: opacity 0.5s ease;
  }
  body.title .hud, body.title .mute { opacity: 0; pointer-events: none; }
  .hud .stars { justify-self: end; }
  .lives { display: flex; gap: 6px; direction: ltr; }
  .lives svg { width: 14px; height: 20px; fill: var(--ink); stroke: var(--ink); stroke-width: 1; }
  .lives svg.out { fill: none; stroke: var(--ink-dim); }

  .banner {
    position: fixed;
    left: 0; right: 0;
    top: calc(env(safe-area-inset-top, 0px) + 15vh);
    text-align: center;
    font-family: "Aref Ruqaa", "El Messiri", "Geeza Pro", Tahoma, sans-serif;
    font-size: 38px;
    font-weight: 700;
    line-height: 1.4;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.9s ease;
    text-shadow: 0 0 10px var(--void), 0 0 3px var(--void);
  }
  .banner.on { opacity: 1; }

  .hint {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 10vh);
    padding: 0 22px;
    text-align: center;
    pointer-events: none;
    text-shadow: 0 0 8px var(--void), 0 0 2px var(--void);
    transition: opacity 0.6s ease;
  }
  .hint.gone { opacity: 0; }
  .hint b { display: block; font-family: "Aref Ruqaa", "El Messiri", "Geeza Pro", Tahoma, sans-serif; font-weight: 700; font-size: 34px; line-height: 1.4; }
  .hint small { display: block; font-size: 18px; color: var(--ink-dim); margin-top: 6px; line-height: 1.5; }
  .hint .go { color: var(--ink); font-weight: 700; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }

  /* واجهة البداية: العنوان في الأعلى ولوحة البدء في الأسفل */
  .start {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    justify-content: space-between; align-items: center;
    gap: 16px;
    padding: calc(env(safe-area-inset-top, 0px) + 5vh) 20px calc(env(safe-area-inset-bottom, 0px) + 22px);
    background: linear-gradient(to bottom,
      rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.6) 22%, rgba(0,0,0,0) 40%,
      rgba(0,0,0,0) 58%, rgba(0,0,0,0.88) 68%, rgba(0,0,0,0.97) 100%);
    transition: opacity 0.7s ease, visibility 0.7s;
    overflow-y: auto;
  }
  .start.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  .start-head { text-align: center; animation: drop 0.9s ease both; }
  .start-panel { animation: rise 0.9s 0.15s ease both; }
  @keyframes drop { from { opacity: 0; transform: translateY(-14px); } }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
  .start h1 {
    margin: 0;
    font-family: "Aref Ruqaa", "El Messiri", "Geeza Pro", Tahoma, serif;
    font-weight: 700;
    font-size: clamp(88px, 31vw, 140px);
    line-height: 1.2;
    text-shadow: 0 0 26px rgba(236,230,251,0.35), 0 3px 0 var(--void);
  }
  .start .rule {
    width: 150px; height: 9px; margin: 0 auto 10px;
    background:
      linear-gradient(var(--ink), var(--ink)) center / 9px 9px no-repeat,
      linear-gradient(var(--ink-dim), var(--ink-dim)) center / 100% 1px no-repeat;
    position: relative;
  }
  .start .rule::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 9px; height: 9px; background: var(--ink);
    transform: translate(-50%, -50%) rotate(45deg);
  }
  .start .kicker { margin: 0; font-size: 18px; font-weight: 500; color: var(--ink); text-shadow: 0 0 8px var(--void), 0 0 2px var(--void); }

  .start-panel {
    width: min(100%, 372px);
    padding: 18px 18px 12px;
    background: rgba(0,0,0,0.78);
    border: 1px solid var(--ink-dim);
    box-shadow: 0 0 0 4px var(--void), 0 0 0 5px var(--ink-dim);
  }
  .play {
    display: block;
    width: 100%; min-height: 60px;
    padding: 8px 20px;
    font-family: "Aref Ruqaa", "El Messiri", "Geeza Pro", Tahoma, serif;
    font-weight: 700;
    font-size: 30px; line-height: 1.3;
    color: var(--void);
    background: var(--ink);
    border: 0;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .play:active { transform: scale(0.97); background: #ffffff; }
  .play:focus-visible { outline: 3px solid var(--ink); outline-offset: 5px; }
  .start .record {
    margin: 12px 0 0; padding: 7px 10px;
    font-size: 16px; font-weight: 700; text-align: center;
    border: 1px dashed var(--ink-dim);
  }
  .start .record:empty { display: none; }
  .how { list-style: none; margin: 12px 0 0; padding: 0; font-size: 16px; line-height: 1.5; color: var(--ink); }
  .how li {
    display: grid; grid-template-columns: 24px 1fr; gap: 12px; align-items: center;
    padding: 8px 2px; text-align: start;
    border-top: 1px solid rgba(163,157,182,0.35);
  }
  .how svg { width: 22px; height: 22px; fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .credit {
    margin: 4px 0 0; padding-top: 10px;
    border-top: 1px solid var(--ink-dim);
    font-size: 14px; text-align: center; color: var(--ink-dim);
  }
  .credit bdi { font-weight: 700; color: var(--ink); }

  .mute {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    left: 14px;
    width: 44px; height: 44px;
    display: grid; place-items: center;
    background: var(--void);
    color: var(--ink);
    border: 1px solid var(--ink-dim);
    border-radius: 0;
    padding: 0;
    cursor: pointer;
    transition: opacity 0.5s ease;
  }
  .mute:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .mute svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; }
  .mute .off { display: none; }
  .mute[aria-pressed="true"] .on { display: none; }
  .mute[aria-pressed="true"] .off { display: inline; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  @media (max-width: 260px) {
    .hud { font-size: 13px; padding: 0 8px; top: calc(env(safe-area-inset-top, 0px) + 8px); }
    .lives svg { width: 9px; height: 13px; }
    .hint b { font-size: 20px; } .hint small { font-size: 13px; }
    .banner { font-size: 20px; }
    .start h1 { font-size: 52px; } .play { font-size: 20px; min-height: 44px; }
    .start { padding-left: 8px; padding-right: 8px; } .start-panel { padding: 8px; }
    .how, .start .kicker, .credit { display: none; }
    .mute { display: none; }
  }
  @media (max-height: 520px) { .how { display: none; } .start h1 { font-size: 64px; } }
  @media (prefers-reduced-motion: reduce) {
    .hint, .banner, .start, .hud { transition: none; }
    .hint .go, .start-head, .start-panel { animation: none; }
  }
</style>
</head>
<body class="title">
<div id="stage" tabindex="0" role="application" aria-label="لعبة صعود: اسحب لتدير البرج أو اضغط مطوّلاً لتصعد الدرج الحلزوني، وتفادَ الصخور الساقطة">
  <canvas id="c"></canvas>
</div>
<div class="hud">
  <span id="floor">الطابق ٠</span>
  <span class="lives" id="lives" role="img" aria-label="الشعلات الباقية ٣"></span>
  <span class="stars" id="stars">✦ ٠</span>
</div>
<div class="banner" id="banner"></div>
<div class="hint gone" id="hint"></div>
<button class="mute" id="mute" type="button" aria-pressed="false" aria-label="كتم الصوت">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M3 9h4l5-4v14l-5-4H3z"/>
    <path class="on" d="M16 9c1.5 1.5 1.5 4.5 0 6M19 6c3 3 3 9 0 12"/>
    <path class="off" d="M16 9l6 6M22 9l-6 6"/>
  </svg>
</button>
<div class="start" id="start">
  <header class="start-head">
    <h1>صعود</h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="kicker">برجٌ بلا نهاية وشعلة واحدة</p>
  </header>
  <div class="start-panel">
    <button class="play" id="play" type="button">ابدأ الصعود</button>
    <p class="record" id="record"></p>
    <ul class="how">
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg><span>اسحب بإصبعك ليدور البرج</span></li>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8.5"/></svg><span>أو اضغط مطوّلاً لتصعد دون توقف</span></li>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.6 6.2 6.4.5-4.9 4.2 1.5 6.3L12 16.9 6.4 20.2l1.5-6.3L3 9.7l6.4-.5z"/></svg><span>تفادَ الصخور واجمع النجوم</span></li>
    </ul>
    <p class="credit">تطوير <bdi>ابوالحسن عبدالهادي 42i</bdi></p>
  </div>
</div>
<div class="sr" id="live" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  // ---------- ثوابت العالم (كل وحدة عالم = S بكسل) ----------
  const S = 2, TAU = Math.PI * 2;
  const RW = 44;                  // نصف قطر البرج
  const RS = 62;                  // طرف الدرجة الخارجي
  const RM = 53;                  // خط سير الفارس
  const RG = 84;                  // نصف قطر الصخرة التي يقوم عليها البرج
  const N = 24, DA = TAU / N;     // درجات كل لفّة
  const SH = 4, REV = N * SH, TH = 6;
  const TREAD_PX = RM * DA * S, RISE_PX = SH * S;   // المسافة بين درجتين على الشاشة
  const TILT = 0.32, TS = TILT * S;
  const ZONE_LEN = 6, CP_EVERY = 3;
  const MOON_A = 0.9;             // اتجاه ضوء القمر في العالم
  const ZONES = ['أسفل البرج', 'جدار اللبلاب', 'برج الرموز'];
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const $ = id => document.getElementById(id);
  const stage = $('stage'), canvas = $('c'), ctx = canvas.getContext('2d');
  const floorEl = $('floor'), livesEl = $('lives'), starsEl = $('stars');
  const hintEl = $('hint'), bannerEl = $('banner'), liveEl = $('live'), muteEl = $('mute');
  const startEl = $('start'), playEl = $('play'), recordEl = $('record');

  const mod = (a, n) => ((a % n) + n) % n;
  const wrap = a => mod(a + Math.PI, TAU) - Math.PI;
  function hash(n) {
    n = Math.imul(n ^ 0x9e3779b9, 0x85ebca6b); n ^= n >>> 13;
    n = Math.imul(n, 0xc2b2ae35); n ^= n >>> 16;
    return (n >>> 0) / 4294967296;
  }
  function vnoise(x, y, perX, perY) {
    const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
    const x0 = mod(xi, perX), x1 = mod(xi + 1, perX), y0 = mod(yi, perY), y1 = mod(yi + 1, perY);
    const a = hash(x0 * 374761 + y0 * 668265 + 11), b = hash(x1 * 374761 + y0 * 668265 + 11);
    const c = hash(x0 * 374761 + y1 * 668265 + 11), d = hash(x1 * 374761 + y1 * 668265 + 11);
    const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
  }
  const zoneOf = k => Math.floor(Math.max(0, k) / ZONE_LEN) % 3;

  // ---------- السماء: نجوم وغيوم تُحسب مرة واحدة ----------
  const PER = 1005, SKH = 512, SKY_K = PER / TAU;
  const starTex = new Uint8Array(PER * SKH), cloudTex = new Uint8Array(PER * SKH);
  (function buildSky() {
    for (let y = 0, i = 0; y < SKH; y++) for (let x = 0; x < PER; x++, i++) {
      const n = vnoise(x / PER * 14, y / SKH * 9, 14, 9) * 0.65 + vnoise(x / PER * 28, y / SKH * 18, 28, 18) * 0.35;
      cloudTex[i] = n > 0.6 ? Math.min(70, (n - 0.6) * 1.6 * 255) : 0;
      if (hash(i * 31 + 5) > 0.9905) starTex[i] = 1 + ((hash(i * 17 + 3) * 200) | 0);
    }
    for (let k = 0; k < 90; k++) {       // نجوم أكبر على شكل صليب
      const x = (hash(k * 911 + 1) * PER) | 0, y = 3 + ((hash(k * 577 + 2) * (SKH - 6)) | 0);
      const big = hash(k * 13) > 0.6 ? 2 : 1;
      for (let d = -big; d <= big; d++) {
        starTex[y * PER + mod(x + d, PER)] = 255;
        starTex[(y + d) * PER + x] = 255;
      }
    }
  })();

  // ---------- الشاشة وذاكرة نسيج البرج ----------
  let W = 290, H = 580, PXC = 1.4, img = null, buf = null, cx = 145;
  const RC = RW * S;
  const CU = Math.round(TAU * RC);
  const CH = 64;
  const chunks = new Map();
  let tx0 = 0, tx1 = 0, colPhi, colCos, colDep, colU, colXw, colDw;

  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;
    let dev = Math.max(1, Math.round(Math.min(vw, vh, 520) / 270 * dpr));
    do {
      PXC = dev / dpr;
      W = Math.ceil(vw / PXC); H = Math.ceil(vh / PXC);
      dev++;
    } while (W * H > 340000);
    canvas.width = W; canvas.height = H;
    canvas.style.width = (W * PXC) + 'px';
    canvas.style.height = (H * PXC) + 'px';
    img = ctx.createImageData(W, H);
    buf = new Float32Array(W * H);
    cx = W >> 1;
    tx0 = Math.max(0, cx - RC); tx1 = Math.min(W - 1, cx + RC - 1);
    const n = tx1 - tx0 + 1;
    colPhi = new Float32Array(n); colCos = new Float32Array(n); colDep = new Int32Array(n);
    colU = new Float32Array(n); colXw = new Float32Array(n); colDw = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const X = tx0 + i - cx + 0.5, ph = Math.asin(Math.max(-1, Math.min(1, X / RC))), c = Math.cos(ph);
      colPhi[i] = ph; colCos[i] = c; colDep[i] = Math.round(RC * c * TILT);
      colU[i] = ph / TAU * CU; colXw[i] = X / S; colDw[i] = RW * c;
    }
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- نسيج سطح البرج ----------
  const winCache = new Map();
  function winsAt(n) {
    let w = winCache.get(n);
    if (w) return w;
    w = [];
    if (n >= 0) {
      const a0 = hash(n * 31 + 7) * TAU;
      for (let j = 0; j < 2; j++) {
        const h = hash(n * 7919 + j * 101 + 13);
        if (h > (j ? 0.45 : 0.8)) continue;
        const a = mod(a0 + j * Math.PI, TAU);
        w.push({ a, y: (a / TAU + n) * REV + 38, glow: h < (j ? 0.25 : 0.5) });
      }
    }
    winCache.set(n, w);
    if (winCache.size > 200) winCache.clear();
    return w;
  }
  function bricks(a, wy) {
    const row = Math.floor(wy / 7);
    const bu = a / TAU * 20 + (row & 1) * 0.5, bi = Math.floor(bu);
    if (mod(wy, 7) < 0.6 || bu - bi < 0.045) return 0.1;
    const hb = hash(row * 131 + (bi % 20) * 17);
    return hb > 0.92 ? 0.17 : 0.27 + hb * 0.17;
  }
  function towerTex(a, wy) {
    const m = towerBase(a, wy);
    if (m <= 0) return m;
    // ظل الدرج على الجدار: أغمق تحته مباشرة، وأثر خفيف فوقه
    const hs = mod(wy - a / TAU * REV, REV);
    if (hs > REV - TH - 11 && hs <= REV - TH + 1) return m * (0.32 + 0.6 * (REV - TH + 1 - hs) / 12);
    if (hs < 2.2) return m * 0.7;
    return m;
  }
  function towerBase(a, wy) {
    const n0 = Math.floor(wy / REV);
    for (let n = n0; n >= n0 - 1; n--) {
      const ws = winsAt(n);
      for (let q = 0; q < ws.length; q++) {
        const w = ws[q];
        const ax = wrap(a - w.a) * RW, ay = wy - w.y, aax = ax < 0 ? -ax : ax;
        if (aax > 12 || ay < -3 || ay > 36) continue;
        if (ay < 0) return 0.95;
        const up = ay - 20;
        if (!(aax <= 10 && (ay < 20 || (aax + 6) * (aax + 6) + up * up <= 272))) continue;
        const inInner = ay >= 2 && aax <= 8 && (ay < 20 || (aax + 6) * (aax + 6) + up * up <= 204);
        if (!inInner) return 0.95;
        if ((ax >= -0.6 && ax < 0.6) || (ay >= 13 && ay < 14.2)) return 0.85;
        if (!w.glow) return mod(ax, 4) < 0.8 ? 0.7 : 0;
        if (mod(ax + ay, 6) < 0.7 || mod(ax - ay, 6) < 0.7) return 0;
        return -0.62;
      }
    }
    if (wy < 6) return mod(wy, 6) < 0.6 || mod(a / TAU * 12, 1) < 0.04 ? 0.08 : 0.5;   // قاعدة البرج
    const fb = mod(wy, REV);                                     // إفريز حجري عند كل طابق
    if (fb < 1.3) return 0.78;
    if (fb < 2.6) return 0.1;
    if (fb > REV - 1.2) return 0.55;
    const zone = zoneOf(n0);
    if (zone === 1) {
      const nv = vnoise(a / TAU * 10, wy / 24, 10, 4096);
      if (nv > 0.54) {
        const hl = hash(Math.floor(a / TAU * 110) * 57 + Math.floor(wy / 2.5) * 113);
        return hl > 0.5 ? 0.85 : hl > 0.22 ? 0.42 : 0.06;
      }
      return bricks(a, wy);
    }
    if (zone === 2) {
      const row = Math.floor(wy / 14);
      const bu = a / TAU * 10 + (row & 1) * 0.5, bi = Math.floor(bu), fr = bu - bi, frv = mod(wy, 14) / 14;
      if (frv < 0.05 || fr < 0.025) return 0.07;
      const id = row * 131 + (bi % 10) * 17;
      if (hash(id) < 0.32) {
        const ci = Math.floor((fr - 0.5) * 27.6 / 1.7 + 2.5), ri = Math.floor((frv - 0.5) * 14 / 1.7 + 2.5);
        if (ci >= 0 && ci < 5 && ri >= 0 && ri < 5 && hash(id * 91 + (ci > 2 ? 4 - ci : ci) * 7 + ri * 13) > 0.5) return -0.9;
      }
      return 0.3 + hash(id + 5) * 0.14;
    }
    return bricks(a, wy);
  }
  function getChunk(cy) {
    let c = chunks.get(cy);
    if (c) return c;
    c = new Float32Array(CU * CH);
    for (let r = 0, i = 0; r < CH; r++) {
      const wy = (cy * CH + r) / S;
      for (let u = 0; u < CU; u++, i++) c[i] = towerTex(u / CU * TAU, wy);
    }
    chunks.set(cy, c);
    if (chunks.size > 26) for (const key of chunks.keys()) if (Math.abs(key - cy) > 12) chunks.delete(key);
    return c;
  }

  // ---------- رسوم صغيرة ----------
  function scale2x(rows) {
    const h = rows.length, w = rows[0].length;

    const ghosts = [];
    for (let n = Math.max(1, Math.floor(botW / REV) - 1); n * REV < topW + 20; n++) {
      if (hash(n * 104729 + 5) >= 0.45) continue;
      const a = hash(n * 311 + 9) * TAU + (reduceMotion ? 0 : time * 0.12 * (n & 1 ? 1 : -1));
      const y = n * REV + 30 + hash(n * 17) * 40 + (reduceMotion ? 0 : Math.sin(time * 1.6 + n) * 3);
      const rel = a - cam, gx = (RS + 24) * Math.sin(rel), gd = (RS + 24) * Math.cos(rel);
      const d = Math.hypot(gx - tx, y + 9 - ty, gd - td);
      const al = Math.max(0, Math.min(1, (d - 30) / 34)) * 0.85;
      if (al > 0.04) ghosts.push({ sx: cx + gx * S + shx, sy: camTopB - (y * S - gd * TS), al, back: gd < 0, flip: Math.sin(rel) > 0 });
    }
    for (const g of ghosts) if (g.back) sprite(GHOST, g.sx, g.sy, g.flip, g.al);

    stepList.length = 0;
    const iMin = Math.max(1, Math.floor((botW - RS * TILT * 2) / SH) - 3), iMax = Math.ceil((topW + RS * TILT) / SH) + 2;
    for (let i = iMin; i <= iMax; i++) stepList.push(i);
    stepList.sort((a, b) => Math.cos(a * DA - cam) - Math.cos(b * DA - cam));
    let si = 0;
    for (; si < stepList.length && Math.cos(stepList[si] * DA - cam) < 0; si++) { drawCorbel(stepList[si]); drawStep(stepList[si]); }

    // ---- 3: سطح البرج ----
    const ubase = mod(cam, TAU) / TAU * CU;
    for (let sx = tx0; sx <= tx1; sx++) {
      const k = sx - tx0;
      const u = mod(Math.floor(ubase + colU[k]), CU);
      const cosp = colCos[k], limbS = 0.25 + 0.75 * cosp;
      const mc = Math.max(0, Math.cos(cam + colPhi[k] - MOON_A));
      const ml = mc * 0.34 + mc * (1 - cosp) * (1 - cosp) * 0.6;
      const xw = colXw[k], dw = colDw[k];
      let nc = 0;
      for (let q = 0; q < nl; q += 5) {
        const dx = xw - lights[q], dd = dw - lights[q + 2], h2 = dx * dx + dd * dd;
        if (h2 < lights[q + 4]) { cl[nc++] = h2; cl[nc++] = lights[q + 1]; cl[nc++] = lights[q + 3]; cl[nc++] = lights[q + 4]; }
      }
      let vi = camTopB + colDep[k];
      let cy = Math.floor(vi / CH), chunk = getChunk(cy), rb = (vi - cy * CH) * CU + u;
      for (let sy = 0, bi = sx; sy < H; sy++, bi += W, vi--, rb -= CU) {
        if (vi < 0) break;
        if (rb < 0) { cy--; chunk = getChunk(cy); rb += CH * CU; }
        const m = chunk[rb];
        if (m > 0) {
          const wy = vi / S;
          let l = 0;
          for (let c = 0; c < nc; c += 4) {
            const dy = wy - cl[c + 1], d2 = cl[c] + dy * dy;
            if (d2 < cl[c + 3]) { const ll = 1 - Math.sqrt(d2) / cl[c + 2]; if (ll > l) l = ll; }
          }
          if (l > 0) { l = l * (2 - l) * 1.9; if (l > 1) l = 1; }
          l = l * limbS + ml;
          buf[bi] = m * (l > 1 ? 1 : l);
        } else buf[bi] = m < 0 ? -m * (0.45 + 0.55 * cosp) : 0;
      }
    }

    // ---- 4: ما يقع أمام البرج ----
    for (const sc of sconces) {
      const bx = VX(RW + 3, sc.a), by = VY(RW + 3, sc.a, sc.y);
      glow(bx, by - 16, 20, 0.6);
      sprite(SCONCE, bx, by, false, 1);
      sprite(FLAME[reduceMotion ? 0 : Math.floor(time * 8 + sc.y) % 2], bx, by - 8, false, 1);
    }
    for (; si < stepList.length; si++) { drawCorbel(stepList[si]); drawStep(stepList[si]); }

    for (const b of braziers) {
      if (b.c < 0.15) continue;
      const bx = VX(RW + 7, 0), by = VY(RW + 7, 0, b.y);
      sprite(BRAZIER, bx, by, false, b.lit ? 1 : 0.5);
      if (b.lit) {
        glow(bx, by - 26, 26, 0.65);
        sprite(FLAME[reduceMotion ? 0 : Math.floor(time * 8 + b.y) % 2], bx, by - 16, false, 1);
        if (!reduceMotion && Math.random() < dt * 6) bits.push({ x: bx + Math.random() * 8 - 4, Y: camTopB - by + 34, vx: Math.random() * 16 - 8, vy: 32, g: 0, life: 0.8, big: 0 });
      }
    }

    // غبار يسبح في الضوء
    if (!reduceMotion) {
      while (motes.length < 26) motes.push({ x: (Math.random() * 2 - 1) * 150, y: (Math.random() * 2 - 1) * 150, ph: Math.random() * 6 });
      for (const d of motes) {
        d.y -= 6 * dt; d.x += (Math.sin(time * 0.7 + d.ph) * 8 - spd * 6) * dt;
        const dd = d.x * d.x + d.y * d.y;
        if (dd > 26000) { d.x = (Math.random() * 2 - 1) * 130; d.y = (Math.random() * 2 - 1) * 130; continue; }
        if (dd < R * R * 2.6) put(Math.round(cx + d.x), Math.round(feetSy - 60 + d.y), 0.75);
      }
    }

    // علامات التحذير والنجوم والصخور
    const tw = Math.floor(time * 4) % 2;
    for (const o of things) {
      const a = o.q * DA;
      if (Math.cos(a - cam) < -0.1) continue;
      const osx = VX(RM, a);
      if (o.kind === 'rock') {
        if (Math.floor(time * 7) % 2) sprite(MARK, osx, VY(RM, a, o.ty + 5), false, 1);
        if (o.wait <= 0) sprite(ROCK[o.v], osx, VY(RM, a, o.y), false, 1);
      } else {
        const bob = o.rest && !reduceMotion ? Math.sin(time * 3) * 1.5 : 0;
        sprite(o.kind === 'ember' ? FLAME[tw] : STAR[tw], osx, VY(RM, a, o.y + bob), false, 1);
      }
    }

    // الفارس
    const blink = time < hurtUntil && Math.floor(time * 12) % 2;
    if (!blink) {
      if (mode !== 'dead') glow(cx + shx + 15, feetSy - 68, 30 + flick, 0.7);
      drawKnight(p, spd, mode !== 'dead', time, capeBlow);
      blitKnight(cx + shx, feetSy);
      if (mode !== 'dead' && !reduceMotion && Math.random() < dt * 10) {
        bits.push({ x: cx + 15 + Math.random() * 6 - 3, Y: feetY + 70, vx: Math.random() * 16 - 8 - spd * 8, vy: 28 + Math.random() * 16, g: 0, life: 0.6 + Math.random() * 0.7, big: 0 });
      }
    }

    for (const g of ghosts) if (!g.back) sprite(GHOST, g.sx, g.sy, g.flip, g.al);

    // الشرر والحطام
    for (let i = bits.length - 1; i >= 0; i--) {
      const b = bits[i];
      b.life -= dt; b.vy -= b.g * dt; b.x += b.vx * dt; b.Y += b.vy * dt;
      if (b.life <= 0) { bits.splice(i, 1); continue; }
      const X = Math.round(b.x), Yy = Math.round(camTopB - b.Y);
      put(X, Yy, 1);
      if (b.big) { put(X + 1, Yy, 1); put(X, Yy + 1, 1); put(X + 1, Yy + 1, 1); }
    }

    // ---- 5: التحويل إلى لونين بالتنقيط ----
    const data = img.data;
    for (let sy = 0, i = 0, o = 0; sy < H; sy++) {
      const by = ((camTopB - sy) & 3) << 2;
      for (let sx = 0; sx < W; sx++, i++, o += 4) {
        const on = buf[i] > BAYER[by | (sx & 3)];
        data[o] = on ? INK[0] : 0; data[o + 1] = on ? INK[1] : 0; data[o + 2] = on ? INK[2] : 0; data[o + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
