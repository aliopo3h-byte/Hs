<style>
:root{
  /* ألوان */
  --ink:#3a2418; --ink-soft:#5d4331; --halo:rgba(255,246,228,.6); --sand:#d9b27c;
  --glass:rgba(255,250,240,.66); --glass-line:rgba(90,60,30,.22);
  --card:rgba(255,251,242,.95); --card-ink:#3a2418; --card-soft:#6a5140;
  --water:#3f93d1; --water-hi:#7cc4ee; --gold:#e8a53a; --focus:#1f6fb2; --ink-tool:#3a2418;
  /* سلّم الخطوط: ١٢ · ١٤ · ١٦ · ٢٠ */
  --fs-xs:12px; --fs-sm:14px; --fs-md:16px; --fs-lg:20px;
  --fs-num:clamp(36px,min(11vw,7vh),60px); --fs-display:clamp(44px,min(12.5vw,9.5vh),80px); --fs-title:clamp(40px,min(12vw,10vh),72px);
  /* سلّم المسافات: ٤ · ٨ · ١٢ · ١٦ · ٢٤ */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  --sans:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --quran:'Amiri Quran','Amiri','Noto Naskh Arabic','Traditional Arabic',serif;
  --hud-w:min(92vw,520px); --bar-w:min(76vw,400px);
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --card:rgba(38,28,21,.92); --card-ink:#f7ecd9; --card-soft:#d6c3a8; --glass:rgba(40,30,22,.58); --glass-line:rgba(255,235,205,.24); --ink-tool:#f7ecd9; }
}
:root[data-theme="dark"]{ --card:rgba(38,28,21,.92); --card-ink:#f7ecd9; --card-soft:#d6c3a8; --glass:rgba(40,30,22,.58); --glass-line:rgba(255,235,205,.24); --ink-tool:#f7ecd9; }
/* أثناء العاصفة تصبح السماء داكنة: ننقل الحبر إلى الفاتح */
body.dim{ --ink:#fbf3e4; --ink-soft:#eadfca; --halo:rgba(26,22,38,.62); }
html[lang="ar"]{ --serif:'Amiri','Noto Naskh Arabic','Traditional Arabic',serif; }
html[lang="en"]{ --serif:'Lora',Georgia,'Times New Roman',serif; }
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; margin:0; }
body{ background:var(--sand); color:var(--ink); font-family:var(--sans); font-size:var(--fs-md); line-height:1.6; overflow:hidden; -webkit-tap-highlight-color:transparent; touch-action:manipulation; user-select:none; -webkit-user-select:none; text-rendering:optimizeLegibility; -webkit-font-smoothing:antialiased; font-synthesis:none; transition:color .3s; }
p,h1,h2{ margin:0; letter-spacing:0; }
#scene{ position:fixed; inset:0; display:block; width:100%; height:100%; cursor:pointer; }
button{ font:inherit; color:inherit; cursor:pointer; border:0; background:none; letter-spacing:0; }
:focus-visible{ outline:3px solid var(--focus); outline-offset:3px; }

/* ---- الأدوات العلوية: صف ثابت لا يدخل في تدفّق النص ---- */
.tools{ position:fixed; z-index:6; top:calc(env(safe-area-inset-top,0px) + 10px); inset-inline-end:12px; display:flex; gap:var(--s2); }
.icon{ width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:var(--glass); border:1px solid var(--glass-line); box-shadow:0 4px 14px rgba(40,24,10,.16), inset 0 1px 0 rgba(255,255,255,.35); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); color:var(--ink-tool); font-size:var(--fs-sm); font-weight:600; line-height:1; transition:transform .15s, background .2s; }
.icon:active{ transform:scale(.92); }
.icon svg{ width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.icon[aria-pressed="true"]{ background:linear-gradient(180deg,#62b6ea,#3586c6); color:#fff; border-color:transparent; }
.icon .on{ display:none; } .icon[data-state="on"] .on{ display:block; } .icon[data-state="on"] .off{ display:none; }

/* ---- لوحة العرض: عمود واحد، إيقاع رأسي ثابت ---- */
.scrim{ position:fixed; inset:0 0 auto 0; height:44%; z-index:1; pointer-events:none; background:linear-gradient(to bottom,rgba(255,246,228,.34),rgba(255,246,228,0)); transition:opacity .8s; }
body.dim .scrim{ opacity:.25; }
#hud{ position:fixed; z-index:2; inset:0; pointer-events:none; display:flex; justify-content:center; align-items:flex-start; padding:calc(env(safe-area-inset-top,0px) + 58px) var(--s4) 0; opacity:0; transition:opacity 1s .5s; }
body.playing #hud{ opacity:1; }
.hud-main,.hud-final{ width:var(--hud-w); display:flex; flex-direction:column; align-items:center; text-align:center; transition:opacity .9s, transform .9s; }
.hud-final{ position:absolute; left:0; right:0; margin-inline:auto; top:calc(env(safe-area-inset-top,0px) + 58px); opacity:0; transform:translateY(8px); pointer-events:none; }
body.done .hud-main{ opacity:0; transform:translateY(-8px); }
body.done .hud-final{ opacity:1; transform:none; pointer-events:auto; }
.kicker,.phrase,.meaning,.count,.ms span,.final-title,.final-quote,.final-src,.final-cta,.credit,.i-kicker,.i-title,.i-sub,.i-hint{ text-shadow:0 0 14px var(--halo),0 1px 0 var(--halo); transition:color .3s, text-shadow .3s; }
.kicker{ font-size:var(--fs-sm); line-height:1.4; font-weight:500; color:var(--ink-soft); margin-bottom:var(--s1); }
html[lang="en"] .kicker{ letter-spacing:.02em; }
.phrase{ font-family:'Amiri','Noto Naskh Arabic','Traditional Arabic',serif; font-weight:700; font-size:var(--fs-display); line-height:1.5; color:var(--ink); padding-block:2px; }
.meaning{ font-family:var(--serif); font-size:clamp(15px,4vw,18px); line-height:1.5; color:var(--ink-soft); margin-bottom:var(--s3); }
html[lang="en"] .meaning{ font-style:italic; }
.count{ display:flex; justify-content:center; align-items:baseline; gap:var(--s2); direction:ltr; unicode-bidi:isolate; line-height:1; margin-bottom:var(--s4); font-family:var(--serif); font-variant-numeric:lining-nums tabular-nums; }
.count b{ font-size:var(--fs-num); font-weight:700; color:var(--ink); display:inline-block; min-width:1.1ch; text-align:end; transition:color .3s; }
.count span{ font-size:var(--fs-lg); color:var(--ink-soft); }

.bar{ position:relative; width:var(--bar-w); height:11px; margin-bottom:34px; border-radius:99px; background:rgba(255,250,240,.62); border:1px solid rgba(90,60,30,.26); box-shadow:inset 0 1px 2px rgba(60,36,16,.12); transition:background .6s; }
body.dim .bar{ background:rgba(255,255,255,.22); border-color:rgba(255,255,255,.35); }
.fill{ position:absolute; inset-block:0; inset-inline-start:0; width:0; border-radius:inherit; overflow:hidden; background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 55%),linear-gradient(90deg,var(--water-hi),var(--water)); box-shadow:0 0 12px rgba(80,170,235,.55); transition:width .5s cubic-bezier(.3,.7,.2,1); }
.fill::after{ content:""; position:absolute; inset:0; background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.7) 50%,transparent 70%); background-size:220% 100%; animation:shimmer 2.8s linear infinite; }
@keyframes shimmer{ from{ background-position:120% 0; } to{ background-position:-120% 0; } }
.ms{ position:absolute; top:50%; width:0; height:0; }
.ms i{ position:absolute; left:0; top:0; width:12px; height:12px; border-radius:3px; background:#fffaf0; border:1.5px solid rgba(90,60,30,.42); transform:translate(-50%,-50%) rotate(45deg); transition:background .4s, border-color .4s, transform .5s cubic-bezier(.3,1.6,.5,1), box-shadow .4s; }
.ms.hit i{ background:linear-gradient(135deg,#ffd36e,#e39a26); border-color:#fffaf0; transform:translate(-50%,-50%) rotate(45deg) scale(1.25); box-shadow:0 0 0 3px rgba(232,165,58,.25), 0 0 14px rgba(240,180,70,.8); }
.ms span{ position:absolute; left:0; top:17px; transform:translateX(-50%); white-space:nowrap; font-size:var(--fs-xs); line-height:1.4; color:var(--ink-soft); }
.ms.hit span{ color:var(--ink); font-weight:600; }
.ms[data-at="25"]{ inset-inline-start:25%; } .ms[data-at="50"]{ inset-inline-start:50%; } .ms[data-at="75"]{ inset-inline-start:75%; } .ms[data-at="100"]{ inset-inline-start:100%; }
html[dir="rtl"] .ms[data-at="100"] span{ transform:translateX(-18%); }
html[dir="ltr"] .ms[data-at="100"] span{ transform:translateX(-82%); }

/* بطاقة الآية: تأخذ مكانها في التدفّق تحت الشريط (لا تطفو فوق التسميات) */
.card-wrap{ width:100%; display:flex; justify-content:center; margin-top:8px; }
.card{ width:min(92vw,440px); padding:var(--s4) var(--s5) var(--s3); border-radius:16px; background:var(--card); color:var(--card-ink); border:1px solid var(--glass-line); box-shadow:0 14px 34px rgba(40,24,10,.22); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); opacity:0; visibility:hidden; transform:translateY(-10px) scale(.97); transition:opacity .5s, transform .6s cubic-bezier(.2,.8,.2,1), visibility 0s .6s; }
.card.show{ opacity:1; visibility:visible; transform:none; transition-delay:0s; }
.card{ position:relative; }
.card::before{ content:""; position:absolute; inset:6px; border-radius:11px; border:1px solid rgba(214,150,50,.55); pointer-events:none; }
.card::after{ content:""; position:absolute; top:-9px; left:50%; width:18px; height:18px; margin-left:-9px; background:linear-gradient(135deg,#ffd77a,#dd9424); border:2px solid var(--card); border-radius:4px; transform:rotate(45deg); box-shadow:0 2px 8px rgba(120,70,10,.35); pointer-events:none; }
.card .v{ font-family:var(--quran); font-size:clamp(22px,6vw,28px); line-height:2; color:var(--card-ink); }
.card .t{ font-family:var(--serif); font-size:var(--fs-md); line-height:1.5; color:var(--card-soft); margin-top:var(--s1); }
html[lang="en"] .card .t{ font-style:italic; }
.card .r{ font-size:var(--fs-xs); line-height:1.4; color:var(--card-soft); margin-top:var(--s2); }

/* ---- الختام ---- */
.final-title{ font-family:var(--serif); font-weight:700; font-size:var(--fs-num); line-height:1.4; color:var(--ink); margin-bottom:var(--s2); }
.final-quote{ font-family:var(--serif); font-size:clamp(19px,5.2vw,24px); line-height:2; max-width:28ch; color:var(--ink); }
html[lang="en"] .final-quote{ font-style:italic; line-height:1.6; }
.final-src{ font-size:var(--fs-xs); line-height:1.4; color:var(--ink-soft); margin-top:var(--s2); }
.final-cta{ font-size:var(--fs-md); font-weight:600; line-height:1.5; color:var(--ink); margin-top:var(--s4); }
.streak{ margin-top:var(--s3); padding:var(--s1) var(--s4); border-radius:99px; background:var(--glass); border:1px solid rgba(214,150,50,.6); box-shadow:0 4px 14px rgba(40,24,10,.14); font-size:var(--fs-sm); line-height:1.6; color:var(--ink-tool); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
.streak:empty{ display:none; }

.credit{ font-size:var(--fs-xs); line-height:1.5; font-weight:500; color:var(--ink-soft); }
html[lang="en"] .credit{ letter-spacing:.02em; }
.i-actions .credit{ margin-top:var(--s1); }
.hud-final .credit{ margin-top:var(--s4); }

/* ---- المقدّمة ---- */
#intro{ position:fixed; z-index:4; inset:0; display:flex; flex-direction:column; align-items:center; text-align:center; padding:calc(env(safe-area-inset-top,0px) + 64px) var(--s5) calc(env(safe-area-inset-bottom,0px) + 28px); transition:opacity .9s, visibility .9s; }
body.playing #intro{ opacity:0; visibility:hidden; pointer-events:none; }
.scrimi{ position:absolute; inset:0 0 auto 0; height:55%; background:linear-gradient(to bottom,rgba(255,246,228,.4),rgba(255,246,228,0)); pointer-events:none; }
.i-kicker{ position:relative; font-size:var(--fs-sm); line-height:1.4; font-weight:500; color:var(--ink-soft); margin-bottom:var(--s2); }
html[lang="en"] .i-kicker{ letter-spacing:.02em; }
.i-title{ position:relative; font-family:var(--serif); font-weight:700; font-size:var(--fs-title); line-height:1.4; color:var(--ink); margin-bottom:var(--s2); }
.i-title::after{ content:""; display:block; width:min(52vw,210px); height:12px; margin:2px auto 0; background:radial-gradient(circle at center,var(--gold) 0 3.2px,transparent 3.9px) center/12px 12px no-repeat, linear-gradient(90deg,transparent,rgba(150,96,30,.75) 28%,rgba(150,96,30,.75) 44%,transparent 44.5%,transparent 55.5%,rgba(150,96,30,.75) 56%,rgba(150,96,30,.75) 72%,transparent) center/100% 1.5px no-repeat; }
#intro>p,#intro>h2,.i-actions>*{ animation:rise .9s cubic-bezier(.2,.8,.2,1) both; }
#intro>h2{ animation-delay:.12s; } .i-sub{ animation-delay:.24s; } .i-hint{ animation-delay:.36s; } .i-actions>*{ animation-delay:.5s; } .i-actions>*+*{ animation-delay:.62s; }
@keyframes rise{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }
#bStart{ animation:rise .9s cubic-bezier(.2,.8,.2,1) .5s both, breathe 2.6s ease-in-out 1.4s infinite; }
.final-title{ background:linear-gradient(180deg,var(--ink) 40%,#9a5a12); -webkit-background-clip:text; background-clip:text; }
.i-sub{ position:relative; font-family:var(--serif); font-size:clamp(18px,5vw,24px); line-height:1.5; color:var(--ink-soft); margin-bottom:var(--s4); }
html[lang="en"] .i-sub{ font-style:italic; }
.i-hint{ position:relative; max-width:30ch; font-size:var(--fs-sm); line-height:1.8; color:var(--ink-soft); }
.i-actions{ margin-top:auto; display:flex; flex-direction:column; align-items:center; gap:var(--s3); position:relative; }
.btn{ min-height:54px; padding:0 34px; border-radius:99px; background:var(--card); color:var(--card-ink); border:1px solid var(--glass-line); box-shadow:0 10px 28px rgba(40,24,10,.26); font-family:var(--serif); font-weight:700; font-size:22px; line-height:1.2; display:inline-flex; align-items:center; justify-content:center; gap:10px; transition:transform .15s; }
.btn:active{ transform:scale(.97); }
.btn.primary{ background:linear-gradient(180deg,#6cbcf0,#3f93d6 55%,#2f7fc2); color:#fff; border-color:rgba(255,255,255,.35); text-shadow:0 1px 1px rgba(20,60,100,.35); box-shadow:0 12px 30px rgba(30,96,160,.42), inset 0 1px 0 rgba(255,255,255,.55), inset 0 -3px 8px rgba(20,70,130,.25); }
.btn{ position:relative; }
#bStart{ min-width:200px; animation:breathe 2.6s ease-in-out infinite; }
@keyframes breathe{ 0%,100%{ box-shadow:0 12px 30px rgba(30,96,160,.42), inset 0 1px 0 rgba(255,255,255,.55), inset 0 -3px 8px rgba(20,70,130,.25), 0 0 0 0 rgba(120,190,240,.55); } 50%{ box-shadow:0 12px 30px rgba(30,96,160,.42), inset 0 1px 0 rgba(255,255,255,.55), inset 0 -3px 8px rgba(20,70,130,.25), 0 0 0 12px rgba(120,190,240,0); } }
.tap{ min-height:60px; box-shadow:0 12px 30px rgba(40,24,10,.30), inset 0 1px 0 rgba(255,255,255,.6), inset 0 0 0 4px rgba(232,165,58,.16); }
.btn.tap svg{ width:22px; height:22px; fill:var(--water); filter:drop-shadow(0 1px 1px rgba(20,70,130,.35)); }
.btn.quiet{ min-height:44px; padding:0 22px; box-shadow:none; background:var(--glass); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); color:var(--ink-tool); font-family:var(--sans); font-weight:500; font-size:var(--fs-md); }
.btn svg{ width:20px; height:20px; fill:currentColor; flex:none; }

/* ---- الأسفل ---- */
.dock{ position:fixed; z-index:3; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 22px); display:flex; flex-direction:column; align-items:center; gap:var(--s3); pointer-events:none; opacity:0; transform:translateY(10px); transition:opacity .8s 1s, transform .8s 1s; }
body.playing .dock{ opacity:1; transform:none; }
body.done .dock .tap,body.done .dock .tip{ display:none; }
.dock>*{ pointer-events:auto; }
.tip{ padding:var(--s1) var(--s3); border-radius:99px; background:rgba(40,28,18,.42); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); font-size:var(--fs-xs); line-height:1.6; color:#fff; transition:opacity .8s; pointer-events:none !important; }
body.warm .tip{ opacity:0; }
.tap{ position:relative; min-width:184px; }
.tap::after{ content:""; position:absolute; inset:0; border-radius:inherit; border:2px solid rgba(255,255,255,.85); opacity:0; pointer-events:none; }
.tap.ping::after{ animation:ping .6s ease-out; }
@keyframes ping{ from{ opacity:.9; transform:scale(1); } to{ opacity:0; transform:scale(1.35); } }
.done-actions{ display:none; gap:var(--s3); }
body.done .done-actions{ display:flex; }
.toast{ position:fixed; z-index:9; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 100px); transform:translate(-50%,10px); padding:var(--s2) var(--s4); border-radius:99px; background:var(--card); color:var(--card-ink); font-size:var(--fs-sm); line-height:1.5; opacity:0; transition:opacity .3s, transform .3s; pointer-events:none; box-shadow:0 8px 20px rgba(0,0,0,.2); }
.toast.show{ opacity:1; transform:translate(-50%,0); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* ---- شاشات قصيرة (أفقي) ---- */
@media (max-height:560px){
  #hud{ padding-top:calc(env(safe-area-inset-top,0px) + 12px); }
  .hud-final{ top:calc(env(safe-area-inset-top,0px) + 12px); }
  .phrase{ font-size:clamp(34px,9vh,52px); line-height:1.45; } .count{ margin-bottom:var(--s2); } .count b{ font-size:34px; } .count span{ font-size:var(--fs-md); }
  .meaning{ display:none; } .bar{ margin-bottom:30px; }
  #intro{ padding-top:calc(env(safe-area-inset-top,0px) + 24px); } .i-hint{ display:none; }
  .btn{ min-height:46px; font-size:19px; } .tip{ display:none; }
  .final-quote{ line-height:1.7; }
}
@media (prefers-reduced-motion:reduce){ *{ transition-duration:.01ms !important; animation-duration:.01ms !important; } }
</style>

<body>
<canvas id="scene" aria-label="مشهد يتحوّل من أرض يابسة إلى جنّة مع كل استغفار" role="img"></canvas>
<div class="scrim"></div>

<div class="tools">
  <button class="icon" id="bLang" type="button" aria-label="Language"><span id="bLangT">EN</span></button>
  <button class="icon" id="bSound" type="button" data-state="on" aria-label="الصوت" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path class="on" d="M15.5 9a4 4 0 010 6M18 6.5a8 8 0 010 11"/><path class="off" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
  </button>
  <button class="icon" id="bAuto" type="button" aria-label="تشغيل تلقائي" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path id="autoIcon" d="M8 5.5v13l10-6.5z"/></svg>
  </button>
</div>

<div id="hud">
  <div class="hud-main">
    <p class="kicker" data-i="kicker"></p>
    <h1 class="phrase" lang="ar" dir="rtl">أَسْتَغْفِرُ اللَّهَ</h1>
    <p class="meaning" data-i="meaning"></p>
    <div class="count" aria-hidden="true"><b id="n">0</b><span id="of">/ 100</span></div>
    <div class="bar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="fill" id="fill"></div>

<script>
/* ============================================================

const Scene = (function () {

  const K = {

    skyTopLush: hex('#5f95d6'), skyMidLush: hex('#92bde4'), skyHorLush: hex('#dcecf4'),
    skyTopStorm: hex('#625e70'), skyMidStorm: hex('#837e8b'), skyHorStorm: hex('#a9a3aa'),
    mtFarDry: hex('#c9a590'), mtNearDry: hex('#b08670'), mtFrontDry: hex('#94705a'),
    mtFarLush: hex('#93a6d6'), mtNearLush: hex('#6f88bb'), mtFrontLush: hex('#52709f'),
    mtStorm: hex('#8b8793'),

    stoneB: ['#a39481', '#b9ad98', '#8c7f6d', '#c2b8a3', '#9b8d79'],
    petal: ['#ffffff', '#f7c948', '#f28c3d', '#ee7b93', '#a98fd9', '#fbe6ef', '#ffd2a3'],
  };

  function init(opts) { if (opts && opts.makeCanvas) makeCanvas = opts.makeCanvas; }

  /* ---------------- التخطيط والبناء ---------------- */
  function resize(w, h, ratio, opts) {

  }
  function getHy() { return hy; }

  function buildGrain() {
    const n = 128, cv = makeCanvas(n, n), g = cv.getContext('2d'), id = g.createImageData(n, n), r = mulberry(5);
    for (let i = 0; i < n * n; i++) { const v = 100 + ((r() * 56) | 0); id.data[i * 4] = v; id.data[i * 4 + 1] = v; id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 255; }

  }

  function buildMountains() {

    const mk = (amp, base, ph0, rid) => {
      const ph = [r() * 10 + ph0, r() * 10, r() * 10, r() * 10], pts = [];

      { pts: mk(H * 0.058 * ml, H * 0.006, 4.2, 1.6), haze: 0.10, par: 8 },
      { pts: mk(H * 0.032 * ml, 0, 8.1, 3.1), haze: 0.0, par: 12 },

    treeline = []; for (let x = -12; x < W + 12;) { const rr = (2.4 + r() * 4.4) * Math.max(0.85, U); treeline.push([x, rr, r()]); x += rr * (0.8 + r() * 0.9); }
  }

  function buildStones() {
    const r = mulberry(23); stones = [];

    }
  }

  function buildDry() {
    const [cv, g] = layerCanvas(); const r = mulberry(101);
    const gr = g.createLinearGradient(0, hy, 0, H);
    gr.addColorStop(0, '#e8c990'); gr.addColorStop(0.3, '#dcb47b'); gr.addColorStop(1, '#b48252');
    g.fillStyle = gr; g.fillRect(0, hy - 2, W, H - hy + 2);
    for (let i = 0; i < 46; i++) {
      const x = r() * W, y = hy + r() * (H - hy), rad = (0.08 + 0.18 * r()) * Math.max(W, H * 0.6), dark = r() < 0.5;
      const p = g.createRadialGradient(x, y, 0, x, y, rad);

    }
    const lg = g.createLinearGradient(0, 0, W, 0); lg.addColorStop(0, 'rgba(70,40,14,0.10)'); lg.addColorStop(1, 'rgba(255,232,176,0.10)');
    g.fillStyle = lg; g.fillRect(0, hy, W, H - hy);
    const n = Math.min(1100, Math.round(W * H / 750));
    for (let i = 0; i < n; i++) {
      const y = hy + Math.pow(r(), 0.8) * (H - hy), ps = (y - hy) / (H - hy);
      g.fillStyle = r() < 0.5 ? 'rgba(110,72,38,0.16)' : 'rgba(255,236,192,0.18)';
      g.fillRect(r() * W, y, 1 + ps * 2, 1 + ps * 0.8);
    }
    // تشقّقات ثنائية اللون (ظل + ضوء) لإحساس بالعمق
    const lines = [];
    const trace = (x, y, len, ang, depth, ps) => {
      const segs = 4 + ((r() * 3) | 0), pts = [[x, y]], br = []; let cx = x, cy = y;
      for (let s = 0; s < segs; s++) {
        ang += (r() - 0.5) * 0.55; cx += Math.cos(ang) * len / segs; cy += Math.sin(ang) * len / segs * 0.55; pts.push([cx, cy]);

      }

    };
    const nC = Math.round(34 + W * H / 14000);
    for (let i = 0; i < nC; i++) {
      const ps = Math.pow(r(), 0.65), y = hy + 8 + ps * (H - hy - 8), x = r() * W, len = S * (0.03 + 0.2 * ps) * (0.5 + r());
      trace(x, y, len, r() < 0.72 ? (r() - 0.5) : (r() < 0.5 ? 1.25 : -1.25) + (r() - 0.5) * 0.5, 1, ps);

      lines.forEach((L) => {
        g.beginPath(); L.pts.forEach((p, i) => (i ? g.lineTo(p[0] + off * 0.9, p[1] + off * 0.9) : g.moveTo(p[0] + off * 0.9, p[1] + off * 0.9)));

    });

      const ps = Math.pow(r(), 0.7), y = hy + 10 + ps * (H - hy - 14), x = r() * W, sz = S * (0.004 + 0.012 * ps) * (0.6 + r());
      g.fillStyle = 'rgba(50,30,12,0.28)'; g.beginPath(); g.ellipse(x - sz * 0.25, y + sz * 0.4, sz * 1.1, sz * 0.4, 0, 0, TAU); g.fill();
      g.fillStyle = rgb(mixc(hex('#c2ae92'), hex('#8e7b66'), r())); g.beginPath(); g.ellipse(x, y, sz, sz * 0.62, 0, 0, TAU); g.fill();
      g.fillStyle = 'rgba(255,245,225,0.38)'; g.beginPath(); g.ellipse(x + sz * 0.22, y - sz * 0.2, sz * 0.45, sz * 0.22, 0, 0, TAU); g.fill();
    }

      g.strokeStyle = r() < 0.5 ? 'rgba(168,132,76,0.85)' : 'rgba(196,160,100,0.85)'; g.lineWidth = 0.6 + ps * 0.9;
      g.beginPath(); for (let k = 0; k < 6; k++) { const a = -Math.PI / 2 + (k - 2.5) * 0.28 + (r() - 0.5) * 0.2; g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * len * 0.5, y + Math.sin(a) * len * 0.6, x + Math.cos(a) * len, y + Math.sin(a) * len); } g.stroke();

  }

  function buildLush() {
    const [cv, g] = layerCanvas(); const r = mulberry(202);
    const gr = g.createLinearGradient(0, hy, 0, H);
    gr.addColorStop(0, '#5a8f3f'); gr.addColorStop(0.35, '#7fb24b'); gr.addColorStop(1, '#659838');
    g.fillStyle = gr; g.fillRect(0, hy - 2, W, H - hy + 2);

    }

      { n: Math.min(4200, Math.round(W * H / 260)), len: [3, 10], w: [0.5, 1.0], cols: ['#2f6a2a', '#3f7a2c', '#4c8a32'], a: 0.5 },
      { n: Math.min(2400, Math.round(W * H / 460)), len: [6, 16], w: [0.7, 1.4], cols: ['#5b9a37', '#6caa40', '#7db84a'], a: 0.6 },
      { n: Math.min(1100, Math.round(W * H / 1000)), len: [9, 22], w: [0.9, 1.7], cols: ['#9bc95a', '#b6d977', '#c8e48a'], a: 0.7 },

          g.moveTo(x, y); g.quadraticCurveTo(x + lean * 0.3, y - len * 0.6, x + lean, y - len);

      const y = hy + 6 + Math.pow(r(), 0.8) * (H - hy - 6), ps = (y - hy) / (H - hy), x = r() * W, s = (0.8 + ps * 1.6) * (0.7 + r() * 0.6);

    }

    g.fillStyle = hz; g.fillRect(0, hy, W, (H - hy) * 0.22);

  }

  /* ---------------- الأشجار ---------------- */
  function buildTrees() {
    const r = mulberry(7); trees = [];

      [0.27, 0.030, 0.085, 0, 1, 0.05], [0.74, 0.034, 0.075, 0, 3, -0.04], [0.09, 0.040, 0.100, 0, 0, 0.06], [0.90, 0.042, 0.105, 0, 2, -0.05],

        }

      for (let i = 0; i < 24; i++) {

      }

    });
  }

  function drawTree(ctx, tr, c, t, gSky) {

    // ظل على الأرض (الشمس من اليمين)

    ctx.save(); ctx.translate(bx, by); ctx.lineCap = 'round';
    const wood = mixc(hex('#68412a'), hex('#7d6f78'), haze), woodHi = mixc(hex('#9a6a42'), hex('#a398a4'), haze), woodLo = mixc(hex('#4a2d1a'), hex('#625a66'), haze);
    const hideFine = leaf0 > 0.5, segs = tr.segs;
    // الجذع: شكل مخروطي مع تدرّج

      g2.gain.setValueAtTime(0.0001, t); g2.gain.exponentialRampToValueAtTime(0.05, t + 0.006); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
      o2.connect(g2); g2.connect(this.master); o2.start(t); o2.stop(t + 0.12);
    },
    chime: function (idx, big) {
      if (!this.ctx || st.muted) return; var c = this.ctx, base = [523.25, 587.33, 659.25, 783.99][idx] || 523.25, notes = big ? [1, 1.25, 1.5, 2] : [1, 1.25, 1.5];
      notes.forEach(function (m, i) {
        var t = c.currentTime + 0.04 + i * 0.13, o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.value = base * m;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.07, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + (big ? 2.6 : 1.6));
        o.connect(g); g.connect(Sound.master); o.start(t); o.stop(t + (big ? 2.7 : 1.7));
      });
    }
  };

  /* ---------- اللوحة ---------- */
  var elN = $('#n'), elFill = $('#fill'), elBar = $('#bar'), elCard = $('#card'), cardTimer = 0, finalTimer = 0;
  function applyLang() {
    var L = TXT[st.lang]; document.documentElement.lang = st.lang; document.documentElement.dir = st.lang === 'ar' ? 'rtl' : 'ltr';
    document.title = st.lang === 'ar' ? 'مئة قطرة · ١٠٠ × أستغفر الله' : 'A Hundred Drops · 100 × Astaghfirullah';
    document.querySelectorAll('[data-i]').forEach(function (el) { var v = L[el.getAttribute('data-i')]; if (typeof v === 'string') el.textContent = v; });
    $('#bLangT').textContent = L.langBtn; $('#bLang').setAttribute('aria-label', L.aria.lang);
    $('#bSound').setAttribute('aria-label', L.aria.sound); $('#bAuto').setAttribute('aria-label', L.aria.auto);
    $('#of').textContent = '/ ' + fmt(100);
    var s = $('#bStart'); s.textContent = st.count >= 100 ? L.viewDone : st.count > 0 ? L.resume(fmt(st.count)) : L.start;
    updateHud(); renderStreak();
    if (typeof scheduleFit === 'function') scheduleFit();
  }
  function updateHud() {
    elN.textContent = fmt(st.count); elFill.style.width = st.count + '%'; elBar.setAttribute('aria-valuenow', st.count);
    document.querySelectorAll('.ms').forEach(function (m) { m.classList.toggle('hit', st.count >= +m.getAttribute('data-at')); });
  }
  function renderStreak() { var el = $('#streak'); el.textContent = st.done && st.streak > 0 ? TXT[st.lang].streak(st.streak) : ''; }
  function showCard(at) {
    var c = CARDS[at]; if (!c) return; clearTimeout(cardTimer);
    $('#cV').textContent = c.v; $('#cT').textContent = st.lang === 'ar' ? '' : c.en; $('#cR').textContent = st.lang === 'ar' ? c.ar : c.ref;
    $('#cT').style.display = st.lang === 'ar' ? 'none' : '';
    elCard.classList.add('show');
    $('#live').textContent = (st.lang === 'ar' ? CARD_AR[at] + ' — ' + c.ar : c.en + ' ' + c.ref);
    cardTimer = setTimeout(function () { elCard.classList.remove('show'); }, 5000);
  }
  function toast(msg) { var t = $('#toast'); t.textContent = msg; t.classList.add('show'); setTimeout(function () { t.classList.remove('show'); }, 1800); }

  /* ---------- اللوحة الرئيسية: النقر ---------- */
  var lastTap = 0, clock = 0;
  function tapOnce() {
    if (!st.started || st.done) return;
    var now = performance.now(); if (now - lastTap < 80) return; lastTap = now;
    st.count++; Scene.addDrop(clock); Sound.drop(0.46);
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
    elN.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.16)' }, { transform: 'scale(1)' }], { duration: 240, easing: 'ease-out' });
    var tb = $('#bTap'); tb.classList.remove('ping'); void tb.offsetWidth; tb.classList.add('ping');
    if (st.count >= 3) document.body.classList.add('warm');
    updateHud(); save();
    var mi = MILES.indexOf(st.count);
    if (mi >= 0) { showCard(st.count); Sound.chime(mi, st.count === 100); }
    if (st.count >= 100) finish();
  }
  function finish() {
    st.done = true; st.auto = false; syncAuto();
    if (st.lastDone !== today) { st.streak = st.lastDone === yesterday ? st.streak + 1 : 1; st.lastDone = today; }
    save();
    clearTimeout(finalTimer); finalTimer = setTimeout(function () { clearTimeout(cardTimer); elCard.classList.remove('show'); document.body.classList.add('done'); renderStreak(); }, 5600);
  }
  function begin(auto) {
    Sound.ensure(); Sound.setMuted(st.muted);
    if (st.started) return; st.started = true; document.body.classList.add('playing');
    st.camAnim = true; st.camStart = clock; if (st.count > 0) st.dp = st.count;
    if (st.count >= 3) document.body.classList.add('warm');
    if (st.count >= 100) { st.done = true; document.body.classList.add('done'); renderStreak(); }
    else if (auto) { st.auto = true; syncAuto(); }
  }
  function syncAuto() { var b = $('#bAuto'); b.setAttribute('aria-pressed', st.auto ? 'true' : 'false'); $('#autoIcon').setAttribute('d', st.auto ? 'M7 5.5h3.5v13H7zM13.5 5.5H17v13h-3.5z' : 'M8 5.5v13l10-6.5z'); }
  function reset() {
    clearTimeout(finalTimer); clearTimeout(cardTimer); elCard.classList.remove('show');
    st.count = 0; st.done = false; st.auto = false; st.speed = 6; Scene.reset(); syncAuto();
    document.body.classList.remove('done'); document.body.classList.remove('warm'); updateHud(); applyLang(); save();
  }

  /* ---------- الأحداث ---------- */
  var cv = $('#scene'), ctx = cv.getContext('2d');
  cv.addEventListener('pointerdown', function (e) { if (e.button === 0 || e.pointerType !== 'mouse') tapOnce(); });
  $('#bTap').addEventListener('pointerdown', function (e) { e.preventDefault(); tapOnce(); });
  document.addEventListener('keydown', function (e) {
    if (e.repeat || (e.code !== 'Space' && e.code !== 'Enter')) return;
    var b = e.target && e.target.closest ? e.target.closest('button') : null;
    if (b && b.id !== 'bTap') return;
    if (!st.started) return; e.preventDefault(); tapOnce();
  });
  $('#bStart').addEventListener('click', function () { begin(false); });
  $('#bWatch').addEventListener('click', function () { if (st.count >= 100) { begin(false); return; } begin(true); });
  $('#bAuto').addEventListener('click', function () { if (!st.started) { begin(true); return; } if (st.done) return; st.auto = !st.auto; syncAuto(); Sound.ensure(); });
  $('#bSound').addEventListener('click', function () {
    st.muted = !st.muted; Sound.ensure(); Sound.setMuted(st.muted);
    var b = $('#bSound'); b.setAttribute('data-state', st.muted ? 'off' : 'on'); b.setAttribute('aria-pressed', st.muted ? 'true' : 'false'); save();
  });
  $('#bLang').addEventListener('click', function () { st.lang = st.lang === 'ar' ? 'en' : 'ar'; applyLang(); save(); });
  $('#bAgain').addEventListener('click', reset);
  $('#bShare').addEventListener('click', function () {
    var url = location.href, text = TXT[st.lang].shareText;
    if (navigator.share) { navigator.share({ title: document.title, text: text, url: url }).catch(function () {}); return; }
    try { navigator.clipboard.writeText(text + ' ' + url).then(function () { toast(TXT[st.lang].copied); }, function () { toast(url); }); } catch (e) { toast(url); }
  });
  document.addEventListener('visibilitychange', function () {
    if (!Sound.ctx) return;
    if (document.hidden) { Sound.storm(0); Sound.ctx.suspend(); } else Sound.ctx.resume();
  });

  /* ---------- الرسم ---------- */
  function fit() {
    var w = window.innerWidth, h = window.innerHeight, dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (w * h * dpr * dpr > 3.4e6) dpr = Math.sqrt(3.4e6 / (w * h));
    // نقيس أين تنتهي النصوص (الشريط وتسمياته) ليضع المشهد الغيوم والأفق تحتها
    var bar = $('#bar'), hudBottom = 0;
    if (bar && bar.getBoundingClientRect) { var rc = bar.getBoundingClientRect(); if (rc.bottom > 0) hudBottom = rc.bottom + 32; }
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); Scene.resize(w, h, dpr, { hudBottom: hudBottom });
  }
  var rt = 0; function scheduleFit() { clearTimeout(rt); rt = setTimeout(fit, 140); }
  window.addEventListener('resize', scheduleFit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleFit);
  var tx = 0, ty = 0;
  window.addEventListener('pointermove', function (e) { if (e.pointerType === 'touch') return; tx = (e.clientX / window.innerWidth - 0.5) * 2; ty = (e.clientY / window.innerHeight - 0.5) * 2; });
  Scene.init({});
  fit();
  $('#bSound').setAttribute('data-state', st.muted ? 'off' : 'on'); $('#bSound').setAttribute('aria-pressed', st.muted ? 'true' : 'false');
  applyLang(); syncAuto();

  var last = performance.now(), autoAcc = 0;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now; clock += dt;
    if (st.camAnim) { st.cam = Math.min(1, (clock - st.camStart) / 1.8); if (st.cam >= 1) st.camAnim = false; }
    if (st.auto && st.started && !st.done) { autoAcc += dt; if (autoAcc >= 1.15) { autoAcc = 0; tapOnce(); } }
    var diff = st.count - st.dp;
    if (Math.abs(diff) < 0.004) { st.dp = st.count; if (st.speed > 1) st.speed = 1; }
    else {
      var k = 1 - Math.exp(-dt * 4.2 * st.speed), step = diff * k, minS = Math.min(Math.abs(diff), 4 * st.speed * dt);
      if (Math.abs(step) < minS) step = (diff > 0 ? 1 : -1) * minS; st.dp += step;
    }
    st.px += (tx - st.px) * 0.05; st.py += (ty - st.py) * 0.05;
    var m = Scene.render(ctx, { c: st.dp, t: clock, cam: st.started || st.cam > 0 ? st.cam : 0, px: st.px, py: st.py });
    var dim = m.storm > 0.4; if (dim !== st.dim) { st.dim = dim; document.body.classList.toggle('dim', dim); }
    Sound.storm(st.started && !document.hidden ? m.storm : 0);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
